# ai-orchestrator — the consumer stack: published images, no checkout.
#
# The repository root's `docker-compose.yml` is the development stack and builds from
# source; `docker-compose.prod.yml` overlays it for the operator's own host. This file is
# the third audience: a machine that has only this directory (from a release bundle) and
# pulls the two images the release workflow published to GHCR. It is one self-contained
# file rather than an overlay because an overlay needs the base file, and the base file
# lives in the checkout this stack exists to not need.
#
#   cp .env.example .env          # once, then fill it in
#   docker compose pull
#   docker compose up -d --wait
#
# Everything the base stack asserts still holds here: the contract is two-tier (Operator
# decision 2026-09-20, two-tier configuration contract; reaffirmed 2026-09-30) — the three
# stack secrets use the `${VAR:?...}` fail-closed form and everything else a
# `${VAR:-default}` equal to `.env.example`'s value, never a bare `${VAR}` (hard rule 7) —
# credentials stop at the process that needs them (AD-5: backend-api gets the whole
# contract, web-client gets four variables, the browser's origin never sees the git token
# or the spend key), and configuration is the environment (AD-20).
#
# What production changes, this file carries directly (the reasons are docker-compose.prod.yml's):
# pulled images at a literal version tag, `release.env` then `.env` required, postgres probed with a real query
# (`pg_isready` exits 0 against a missing database), logs rotated, `restart: always`.
#
# Two deliberate differences from the development stack:
#   - postgres publishes no port: only backend-api reaches it, over the compose network.
#     A published 5432 would collide with whatever the consumer machine already runs.
#   - the two application ports publish on `${BIND_ADDRESS:-127.0.0.1}`. Loopback is the
#     default posture; a consumer who sets 0.0.0.0 is exposing a single-token stack to the
#     network and README.md § Exposure says what that means before they do.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, copied from .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
    volumes:
      # postgres:18 declares its volume at /var/lib/postgresql and sets
      # PGDATA=/var/lib/postgresql/18/docker — the pre-18 /var/lib/postgresql/data would
      # mount a directory the image no longer writes to, and the data would not persist
      - pgdata:/var/lib/postgresql
    healthcheck:
      # a query, not `pg_isready`: `pg_isready` treats `FATAL: database "…" does not
      # exist` as *accepting connections* and exits 0, so it would report healthy against
      # a database that is not there and start backend-api into a crash loop.
      # $$ defers the expansion to the container's shell, which has the variables above
      test:
        - CMD-SHELL
        - psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'select 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    restart: always

  backend-api:
    image: ghcr.io/rebecamurillo/ai-orchestrator/backend-api:1.0.0-beta.4
    env_file:
      # the release's version pins first, then the one process that holds every credential
      # (AD-5); both required, because a stack that silently started without its contract
      # would be misconfigured rather than refused. `.env` overrides `release.env`.
      - path: release.env
        required: true
      - path: .env
        required: true
    extra_hosts:
      # LiteLLM, Langfuse and the model server run on the host, not in compose (AD-11)
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_API_PORT:-8000}:${BACKEND_API_PORT:-8000}"
    volumes:
      # base clones, worktrees and step logs
      - work:${WORK_DIR:-/work}
      # ~/.claude ~/.codex ~/.config/opencode: the harness configs and skills
      - agent-home:${AGENT_HOME:-/home/agent}
      # the harness CLIs' npm prefix, reconciled against the `*_VERSION` pins at each start
      - harness-bin:/opt/harness-cli
      # the operator's own workflow files (`OPERATOR_TEMPLATES_DIR`), read-only
      - ./templates:/app/operator-templates:ro
    # not hardened, deliberately (Operator decision, 2026-09-11): this container is the
    # sandbox real agents run in, and a harness may `sudo apt-get` what a target
    # repository's install script needs. README.md § Trust says what that implies.
    # the worktrees and the harness configs are written at run time (NFR-3)
    read_only: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # $$ defers the expansion to the container's shell, which has the contract
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${BACKEND_API_PORT}/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      # before the socket is bound a start reconciles the harness CLIs (up to three bounded
      # npm installs of 120s each when pins changed) and runs `alembic upgrade head`
      start_period: 1800s
    logging: *logging
    restart: always

  web-client:
    image: ghcr.io/rebecamurillo/ai-orchestrator/web-client:1.0.0-beta.4
    environment:
      # exactly five (AD-5). Never GITHUB_TOKEN, never LITELLM_SPEND_KEY, never DATABASE_URL.
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:?set it in .env, copied from .env.example}
      ORCHESTRATOR_SESSION_SECRET: ${ORCHESTRATOR_SESSION_SECRET:?set it in .env, copied from .env.example}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend-api:8000}
      WEB_CLIENT_PORT: ${WEB_CLIENT_PORT:-4321}
      # the one bare reference here: empty is a defined value for this variable, so there is
      # no misconfiguration for `:?` to catch
      ROOT_TEMPLATES: ${ROOT_TEMPLATES:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_CLIENT_PORT:-4321}:${WEB_CLIENT_PORT:-4321}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Astro writes its session store under the working directory
    read_only: false
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      # node, not curl: the slim base carries no HTTP client, and adding one to probe a
      # server that is already node would be a package installed for a single request.
      # `/login` is the one route that answers without a session (1.5).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.WEB_CLIENT_PORT || 4321) + '/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *logging
    restart: always

  # Docker for Runs — off unless VERIFY_DOCKER=true (`./install.sh start --with-docker`
  # enables the profile; by hand, `docker compose --profile docker up -d`). A Docker daemon
  # for target repositories whose commands run `docker compose`; the backend image carries
  # only the client. README.md § Trust weighs what a privileged sidecar gives an agent.
  #   - inside backend-api's network namespace: a port a test publishes is on backend-api's
  #     localhost, where the target's scripts look for it, and nowhere else
  #   - dockerd listens on 127.0.0.1:2375 there only (`dockerd` first: given bare flags,
  #     the dind entrypoint prepends its own `--host=tcp://0.0.0.0:2375`, which every
  #     container on the compose network could reach). `scripts/docker_context.sh` points
  #     the agent's CLI at this address.
  #   - `work` at the same path as backend-api's, so a compose file's relative bind mount
  #     (`./tests/fixtures:/fixtures`) resolves on this daemon's filesystem to the worktree
  #   - bridge and pools on 10.213/16 and 10.214/16, away from 172.16/12 where compose and
  #     Docker Desktop put their networks
  #   - `docker-data` keeps pulled images and build cache across Runs and restarts
  # A backend-api that is recreated or restarted leaves this container in a namespace
  # nobody else is in; `restart: true` recreates it with compose's own recreate, and
  # `./install.sh start` recreates it whenever backend-api cannot reach the daemon.
  docker:
    image: docker:29.4.3-dind
    profiles: ["docker"]
    privileged: true
    network_mode: service:backend-api
    environment:
      # no TLS: the listener is loopback inside one namespace
      DOCKER_TLS_CERTDIR: ""
    command:
      - dockerd
      - --host=tcp://127.0.0.1:2375
      - --tls=false
      - --bip=10.213.0.1/24
      - --default-address-pool=base=10.214.0.0/16,size=24
    volumes:
      - work:${WORK_DIR:-/work}
      - docker-data:/var/lib/docker
    depends_on:
      backend-api:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "docker", "--host", "tcp://127.0.0.1:2375", "version"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging
    restart: always

  # The setup runner (AD-28): runs the client's setup scripts on request, never started by
  # `up`. It reads no env_file and mounts no harness config, login, `work` or `.env`, so a
  # client script cannot see a secret; its own network keeps it off the stack's.
  setup:
    image: ghcr.io/rebecamurillo/ai-orchestrator/backend-api:1.0.0-beta.4
    profiles: ["setup"]
    entrypoint: ["/app/scripts/setup/run.sh"]
    restart: "no"
    environment:
      - BMAD_VERSION
      - ORCH_SETUP_TRIGGER
      - ORCH_RELEASE
    volumes:
      - type: volume
        source: agent-home
        target: /home/agent/.claude/skills
        volume:
          subpath: .claude/skills
      - type: volume
        source: agent-home
        target: /home/agent/.claude/agents
        volume:
          subpath: .claude/agents
      - type: volume
        source: agent-home
        target: /home/agent/.claude/commands
        volume:
          subpath: .claude/commands
      - type: volume
        source: agent-home
        target: /home/agent/.agents/skills
        volume:
          subpath: .agents/skills
      - type: volume
        source: agent-home
        target: /home/agent/.codex/prompts
        volume:
          subpath: .codex/prompts
      - type: volume
        source: agent-home
        target: /home/agent/.config/opencode/skills
        volume:
          subpath: .config/opencode/skills
      - type: volume
        source: agent-home
        target: /home/agent/.config/opencode/agents
        volume:
          subpath: .config/opencode/agents
      - type: volume
        source: agent-home
        target: /home/agent/.config/opencode/commands
        volume:
          subpath: .config/opencode/commands
      - type: volume
        source: agent-home
        target: /home/agent/.orchestrator
        volume:
          subpath: .orchestrator
      - ./setup:/client-setup:ro
      - ./bmad:/bmad:ro
      - ./logs/setup:/logs
    networks:
      - setup
    logging: *logging

volumes:
  pgdata:
  # /work — base clones, worktrees, logs (AD-14)
  work:
  # the agent's home — harness configs and skills (AD-16). Seeded from the
  # backend image the first time it is created, and not backed up (spine Operations).
  agent-home:
  # /opt/harness-cli — the harness CLIs, not backed up. Seeded from the image on first
  # creation; at each start `ensure` copies the image's CLI back when it is at the pin and
  # otherwise installs the `*_VERSION` pin here, so an upgrade outlives a recreate.
  harness-bin:
  # /var/lib/docker of the optional `docker` service: images and build cache of the
  # target repositories' compose stacks. Not backed up; safe to remove while it is stopped.
  docker-data:

networks:
  setup: {}
