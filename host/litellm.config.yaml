# LiteLLM 1.99.0 on the host — the starting configuration (AD-20, AD-11).
#
# Not read by any container: the stack reaches this proxy over HTTP at LITELLM_BASE_URL.
# Every credential is an `os.environ/NAME` reference resolved by the proxy at start-up, so
# this file carries names and never values (hard rule 5).
#
#   export LITELLM_OTEL_V2=true          # required by the langfuse_otel callback below
#   litellm --config host/litellm.config.yaml --port 4000
#
# `model_list` is the whole of what a harness can ask for. Adding a model here and adding
# its alias to LOCAL_MODELS in `.env` are the two halves of offering it to the `local`
# harness; the hosted routes are offered to `claude` and `codex` by name.

model_list:
  # ── hosted, through the provider's own route ──────────────────────────────
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY

  # ── hosted, on the operator's own Claude subscription ─────────────────────
  # Uncomment together with `forward_client_headers_to_llm_api` below to spend a Claude Max
  # or Pro subscription instead of an API key. No `api_key` here on purpose: the credential
  # is the OAuth token Claude Code puts in `Authorization`, forwarded by that switch. Pair
  # it with CLAUDE_SUBSCRIPTION_AUTH=true in the stack's .env — see host/README.md.
  # - model_name: claude-subscription
  #   litellm_params:
  #     model: anthropic/claude-sonnet-4-6

  # ── local, served by oMLX ─────────────────────────────────────────────────
  # `openai/<alias>` with `use_chat_completions_api: true`: oMLX speaks chat completions,
  # and Codex only speaks `/v1/responses`. This is the bridge (addendum §A).
  - model_name: local-coder
    litellm_params:
      model: openai/qwen3.8-27b-4bit
      api_base: os.environ/OMLX_BASE_URL
      api_key: os.environ/OMLX_API_KEY
      use_chat_completions_api: true

  - model_name: local-general
    litellm_params:
      model: openai/qwen3.6-35b-a3b-4bit
      api_base: os.environ/OMLX_BASE_URL
      api_key: os.environ/OMLX_API_KEY
      use_chat_completions_api: true

  - model_name: local-qwen3-coder
    litellm_params:
      model: openai/qwen/qwen3-coder-30b
      api_base: os.environ/OMLX_BASE_URL
      api_key: os.environ/OMLX_API_KEY
      use_chat_completions_api: true

litellm_settings:
  # the Gateway's own spans, on the same Langfuse trace as the harness's (AD-11).
  # Needs LITELLM_OTEL_V2=true in the proxy's environment: the v1 exporter drops the
  # langfuse_* and x-litellm-* headers the adapters attribute spend and traces with.
  callbacks: ["langfuse_otel"]
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Subscription mode only (host/README.md). Forwards the client's own Authorization header
  # upstream, which is how Claude Code's subscription OAuth token reaches Anthropic. It
  # applies to EVERY route on this proxy, not only the Claude one — acceptable here because
  # this proxy is single-tenant and reachable only from the orchestrator (see Egress).
  # forward_client_headers_to_llm_api: true
  # the orchestrator reads GET /spend/logs/v2 with LITELLM_SPEND_KEY; harnesses hold a
  # key_type: llm_api virtual key instead, which cannot reach this route (AD-5)
  store_model_in_db: false
