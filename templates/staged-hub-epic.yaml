name: staged-hub-epic
version: 1
description: >-
  staged: one epic of a hub-Run initiative, driven inside its member submodule, every story
  built by the staged plan / implement / review flow
# family: staged · role: epic · method: spec-gate, stories loop, gen-e2e, e2e, retro, push
# called by: staged-initiative-hub · calls: staged-hub-story · skills: spec-gate (+ BMAD stubs)
# sibling: initiative-hub-epic (auto) — differs in: the stories loop calls `staged-hub-story`;
#          three model inputs (`model`, `plan_model`, `review_model`) and four stage limits
#          are passed through; the epic's own agent rows (`spec-gate`, `gen-e2e`, `retro`)
#          run on `plan_model`. Every git row and its order is the sibling's, unchanged.
inputs:
  project:      { type: project,    required: true }
  repository:   { type: repository, required: true }  # the hub
  base_branch:  { type: string,     required: true }
  branch:       { type: string,     required: true }   # the initiative branch, bound by the
                                                          # caller — never allocated here (this
                                                          # file checks nothing out itself)
  spec_folder:  { type: path,       required: true }   # holds SPEC.md, stories.yaml,
                                                          # stories/ — at the hub, never inside
                                                          # the submodule
  workdir:      { type: string,     required: true }   # repository-relative path of this
                                                          # epic's member submodule
  install:      { type: string,     required: false }  # the epic's full setup command
  test:         { type: string,     required: false }  # the epic's full per-story command
  quality_gate: { type: string,     required: false }  # the epic's full end-to-end command
  epic:         { type: item,       required: false }  # bound when called from
                                                          # initiative-hub@1 — see epic.yaml's
                                                          # own `epic` input for why an `agent`
                                                          # step with no story in scope still
                                                          # wants this bound
  harness:      { type: enum, values: [claude, codex, local], default: claude }
  # Three models: `model` implements, `plan_model` plans and runs this epic's own agent rows,
  # `review_model` reviews (see `staged-hub-story.yaml`).
  model:        { type: string,     required: false }
  plan_model:   { type: string,     required: false }
  review_model: { type: string,     required: false }
  # Limits bound from the Run's own inputs: the four stage limits go to `staged-hub-story`;
  # the epic's own long reads (`spec-gate`, `retro`, `gen-e2e`) take one shared wall clock
  # and the same value as their stall limit, because a read-heavy phase writes nothing and
  # would otherwise look exactly like a hang. Empty resolves to the kind's default.
  plan_timeout_min:   { type: number, required: false, default: 45 }
  build_timeout_min:  { type: number, required: false, default: 180 }
  build_stall_min:    { type: number, required: false, default: 90 }
  review_timeout_min: { type: number, required: false, default: 60 }
  epic_timeout_min:   { type: number, required: false, default: 60 }
  # A callee only, never a root: no `done_checkpoint` input and no tail `checkpoint` step —
  # the caller's `epics` loop plans one `checkpoint` row per epic via its own
  # `pause_after_item_when: epic.done_checkpoint` (see `staged-initiative-hub.yaml`).
steps:
  # Create or check out the initiative branch inside this epic's own submodule — cut from
  # `origin/{{branch}}` when the member's remote already holds it, from `{{base_branch}}`
  # otherwise (AD-7, AD-14). Taken exactly, never allocated: it lives in the submodule's own
  # repository, which this Run's allocator cannot reason about.
  - id: branch
    uses: git.submodule
    with: { workdir: "{{workdir}}", branch: "{{branch}}", base: "{{base_branch}}" }
    gate: deterministic

  # The whole command, `cd` included, is `epics.yaml`'s own data (see
  # `staged-initiative-hub.yaml`'s header): an entry that leaves this field out plans
  # `skipped · no command`, never a bare shell command reaching for a folder nobody named.
  - id: setup
    run: "{{install}}"
    timeout_min: 20
    gate: deterministic

  - id: baseline
    run: "{{test}}"
    on_fail: fail
    gate: deterministic

  # No `workdir`: the spec lives at the hub, so this agent runs at the worktree root.
  - id: spec-gate
    uses: agent
    with:
      harness: "{{harness}}"
      model: "{{plan_model}}"
      skill: spec-gate
      args: { folder: "{{spec_folder}}" }
    prompts:
      dispatch: "Run the skill {skill} in folder+id dispatch mode: spec folder {spec_folder}, story id {story_id}."
      rendered: >-
        The workflow for skill {skill} is already rendered at {path}. Read that file
        fully and follow it; every step, status and halt this dispatch owes is defined
        there. Do not run render_skill.py yourself.
      answer: 'Answer from the operator to the blocking condition "{condition}": {answer}'
    expect:
      files: ["{{spec_folder}}/spec-gate-result.md"]
      success: [done]
      blocked: [blocked]
    timeout_min: "{{epic_timeout_min}}"
    stall_min: "{{epic_timeout_min}}"
    gate: liveness

  - id: stories
    for_each: "{{spec_folder}}/stories.yaml"
    as: story
    pause_after_item_when: "story.done_checkpoint"
    steps:
      - id: story
        uses: template
        with:
          name: staged-hub-story
          inputs:
            project: "{{project}}"
            repository: "{{repository}}"
            branch: "{{branch}}"
            spec_folder: "{{spec_folder}}"
            workdir: "{{workdir}}"
            story: "{{story}}"
            test: "{{test}}"
            harness: "{{harness}}"
            model: "{{model}}"
            plan_model: "{{plan_model}}"
            review_model: "{{review_model}}"
            plan_timeout_min: "{{plan_timeout_min}}"
            build_timeout_min: "{{build_timeout_min}}"
            build_stall_min: "{{build_stall_min}}"
            review_timeout_min: "{{review_timeout_min}}"

  # Unlike `spec-gate` and `retro`, this one carries `workdir`: the tests it writes are the
  # member repository's own, so it dispatches inside the submodule and its Story-shaped
  # write lands there rather than at the hub.
  - id: gen-e2e
    uses: agent
    with:
      harness: "{{harness}}"
      model: "{{plan_model}}"
      skill: bmad-qa-generate-e2e-tests
      args: { folder: "{{spec_folder}}" }
      workdir: "{{workdir}}"
    prompts:
      dispatch: "Run the skill {skill} in folder+id dispatch mode: spec folder {spec_folder}, story id {story_id}."
      rendered: >-
        The workflow for skill {skill} is already rendered at {path}. Read that file
        fully and follow it; every step, status and halt this dispatch owes is defined
        there. Do not run render_skill.py yourself.
      answer: 'Answer from the operator to the blocking condition "{condition}": {answer}'
    timeout_min: "{{epic_timeout_min}}"
    stall_min: "{{epic_timeout_min}}"
    gate: liveness

  - id: commit-e2e
    uses: git.commit
    with: { workdir: "{{workdir}}", message: "e2e: generated tests (orchestrator)" }
    gate: deterministic

  - id: e2e
    run: "{{quality_gate}}"
    on_fail: { redispatch: gen-e2e, max: 2 }
    timeout_min: 45
    gate: deterministic

  # No `workdir`: the retrospective writes into the spec folder, which lives at the hub.
  - id: retro
    uses: agent
    with:
      harness: "{{harness}}"
      model: "{{plan_model}}"
      skill: bmad-retrospective
      args: { folder: "{{spec_folder}}" }
    prompts:
      dispatch: "Run the skill {skill} in folder+id dispatch mode: spec folder {spec_folder}, story id {story_id}."
      rendered: >-
        The workflow for skill {skill} is already rendered at {path}. Read that file
        fully and follow it; every step, status and halt this dispatch owes is defined
        there. Do not run render_skill.py yourself.
      answer: 'Answer from the operator to the blocking condition "{condition}": {answer}'
    timeout_min: "{{epic_timeout_min}}"
    stall_min: "{{epic_timeout_min}}"
    gate: liveness

  # Hub-side, no `workdir`: stages the spec folder (the spec-gate result, the retro's own
  # output, anything a story left uncommitted at the hub) and everything else uncommitted at
  # the worktree root, then commits it in one row. Each story's own hub-side writes already
  # reached a commit at its `commit-story`; this is the epic's sweep.
  - id: commit-retro
    uses: git.commit
    with: { message: "retro: epic retrospective (orchestrator)" }
    gate: deterministic

  - id: push-code
    uses: git.push
    with: { workdir: "{{workdir}}", branch: "{{branch}}" }
    gate: deterministic

  # Bring in whatever origin's initiative branch received during this epic before pushing,
  # so `push-hub` is rejected only by a push that lands inside the window between these two
  # rows — then the existing `retry` (sync first) is the right stop. No `workdir` form exists
  # for `git.merge`, so `push-code` keeps its own behaviour; the member's branch is written
  # by this Run alone.
  - id: merge-hub
    uses: git.merge
    with: { from: "{{branch}}" }
    gate: deterministic

  - id: push-hub
    uses: git.push
    with: { branch: "{{branch}}" }
    gate: deterministic
