name: epic-local-ai
version: 1
description: every story of one epic, one small agent session per build step, for open-source coding agents
# Why this Template exists, and how it differs from `epic@1` / `story@1`:
#
# `story@1` hands the whole `bmad-build-auto` workflow to one session: the harness is asked to
# run a skill, the orchestrator pre-renders `workflow.md`, and the agent carries four steps, a
# status machine, a review panel and the HALT contract in one context. Open-weight models
# behind the `local` harness do not hold that (Operator finding, 2026-09-21 — six attempts,
# six different fumbles), and several of them emit tool calls as text, so a skill dispatch
# never runs at all.
#
# So this Template dispatches `prompt:` instead of `skill:`, once per build step. Each step is
# a new session with one file to read and one thing to do, and nothing of the renderer's
# protocol is assumed. The step files themselves are the ones `bmad.install` already put in the
# harness's own skills directory — `skill_dir` below names it — read raw, with their unrendered
# placeholders explained in each prompt rather than resolved.
#
# **The step markers.** FR-16 routes an `agent` row on one thing: a Story file whose frontmatter
# says `done`. A build step that legitimately ends at `draft`, `ready-for-dev`, `in-progress` or
# `in-review` would therefore park the Run every time. So each row's `expect.files` points at
# its own marker under `{spec_folder}/stories/.auto/` — the step says `done` there when it
# finished its own step, `blocked` when it has a question — while the Story spec itself keeps
# the status the method gives it. The marker is also what a `verify` redispatch rewrites
# (FR-10): the failing command, its exit code and its log tail are appended to the marker the
# fix row is about to read.
#
# **The two fix rows.** The Template DSL routes a failed command backwards and nowhere else
# (`on_fail: {redispatch, max}`, to an `agent` step written earlier), so a fix agent cannot be
# conditional on the gate that has not run yet. `unit-fix` and `gate-fix` therefore run the
# command themselves first and stop immediately when it is green; the `run:` row after each one
# is the deterministic gate that decides, and it redispatches back into the fix row when it is
# red. The cost is one cheap agent turn per gate on a green story.
inputs:
  project:     { type: project,    required: true }
  repository:  { type: repository, required: true }
  base_branch: { type: string,     required: true }
  branch:      { type: string,     required: true }
  spec_folder: { type: path,       required: true }   # holds SPEC.md, stories.yaml, stories/
  epic:        { type: item,       required: false }  # bound when called from initiative
  harness:     { type: enum, values: [claude, codex, local], default: local }
  model:       { type: string,     required: false }
  # Where `bmad.install` / `scripts/harness/*.sh` left the build-auto step files. The default is
  # the `local` (OpenCode) harness inside the backend image (`AGENT_HOME=/home/agent`). For
  # `claude` use `/home/agent/.claude/skills/bmad-build-auto`, for `codex`
  # `/home/agent/.agents/skills/bmad-build-auto`, and for `make local` the same paths under the
  # machine's own HOME.
  skill_dir:
    type: path
    required: false
    default: /home/agent/.config/opencode/skills/bmad-build-auto

steps:
  - id: checkout
    uses: git.worktree
    with: { base: "{{base_branch}}", branch: "{{branch}}" }
    gate: deterministic

  - id: setup
    run: "{{repository.install_command}}"
    timeout_min: 20
    gate: deterministic

  - id: baseline
    run: "{{repository.unit_test_command}}"
    on_fail: fail
    timeout_min: 30
    gate: deterministic

  - id: stories
    for_each: "{{spec_folder}}/stories.yaml"
    as: story
    steps:

      # --- step 1: clarify and route ------------------------------------------------------
      - id: clarify
        uses: agent
        with:
          harness: "{{harness}}"
          model: "{{model}}"
          prompt: |
            You are a coding agent working in this repository. The working directory is the
            repository root.

            TASK: execute exactly one build step — step 1, clarify and route.

            Read this file fully and follow it:
              {{skill_dir}}/step-01-clarify-and-route.md

            Dispatch facts (this is a folder+id dispatch):
              spec folder: {{spec_folder}}
              story id:    {{story.id}}
              story title: {{story.title}}

            How to read that step file:
            - It is an unrendered source. Placeholders written in double braces with a leading
              dot (language, skill level, artifact folders) are not resolved: use English,
              plain markdown, and treat the planning/implementation artifact folders as
              {{spec_folder}}. Placeholders written in single braces and prefixed `workflow.`
              are not resolved either: skip them.
            - A reference written as a bmad-snapshot link names a file of the same name in
              {{skill_dir}}. Open it only when this step's instructions tell you to.
            - IGNORE the `## NEXT` section at the end. This session covers step 1 only.
            - Where the step file tells you to spawn a subagent, do the work yourself instead.

            OUTPUT 1 — the story spec:
              {{spec_folder}}/stories/{{story.id}}-<slug>.md
            with the frontmatter `status` the method gives it at the end of step 1.

            OUTPUT 2 — the step marker, which is how this run reports to the orchestrator.
            Write it last, after everything else, overwriting whatever is there:
              {{spec_folder}}/stories/.auto/{{story.id}}-01-clarify.md
            with exactly this shape:

              ---
              status: done
              ---

              # Step 1 — clarify and route

              ## Auto Run Result

              Status: done
              Spec file: <the path you wrote or resolved above>

            If you cannot finish — a question you cannot answer from the repository, a
            contradiction, a missing file — write the marker with `status: blocked` instead, and
            a line `Blocking condition: <one sentence>` under `## Auto Run Result`. That stops
            the Run for the operator; it is a correct outcome, not a failure. Never write
            `status: done` for work you did not do.

            Do not modify SPEC.md, stories.yaml, epics.yaml, any AGENTS.md, or any existing test
            file in this step.
        expect:
          files: ["{{spec_folder}}/stories/.auto/{{story.id}}-01-clarify.md"]
          status_in: [done, blocked]
        retry:
          max: 1
          prompt: "The previous session left no readable marker at {{spec_folder}}/stories/.auto/{{story.id}}-01-clarify.md. Do the step again and write that marker last, with status done or status blocked."
          resume_session: false
        escalate_when: "output.status == blocked"
        timeout_min: 30
        gate: liveness

      # --- step 2: plan --------------------------------------------------------------------
      - id: plan-spec
        uses: agent
        with:
          harness: "{{harness}}"
          model: "{{model}}"
          prompt: |
            You are a coding agent working in this repository. The working directory is the
            repository root.

            TASK: execute exactly one build step — step 2, plan.

            Read this file fully and follow it:
              {{skill_dir}}/step-02-plan.md

            Dispatch facts:
              spec folder: {{spec_folder}}
              story id:    {{story.id}}
              story title: {{story.title}}

            Resolve the step file's `{spec_file}` yourself: it is the single file matching
              {{spec_folder}}/stories/{{story.id}}-*.md
            If none matches, or more than one does, stop and report blocked (see below).

            How to read that step file:
            - It is an unrendered source. Placeholders written in double braces with a leading
              dot are not resolved: use English, plain markdown, and treat the planning and
              implementation artifact folders as {{spec_folder}}. Placeholders in single braces
              prefixed `workflow.` are not resolved either: skip them.
            - A reference written as a bmad-snapshot link names a file of the same name in
              {{skill_dir}}. The spec template it points at is
              {{skill_dir}}/spec-template.md — read it before you write the spec.
            - IGNORE the `## NEXT` section. This session covers step 2 only, and it stops at the
              READY-FOR-DEVELOPMENT gate. Do not implement anything.
            - Where the step file tells you to spawn subagents for investigation, investigate
              yourself and keep it narrow.

            OUTPUT 1 — the story spec at the path you resolved above, filled out from the spec
            template, with the investigation drained into its `## Code Map` section, and
            frontmatter `status: ready-for-dev` once it meets the ready-for-development
            standard the step file states.

            OUTPUT 2 — the step marker. Write it last, overwriting whatever is there:
              {{spec_folder}}/stories/.auto/{{story.id}}-02-plan.md

              ---
              status: done
              ---

              # Step 2 — plan

              ## Auto Run Result

              Status: done
              Spec file: <the path you wrote>

            If the intent has a gap you cannot close from the repository — several defensible
            readings that lead to different code, with nothing to choose between them — do not
            pick one. Write the marker with `status: blocked` and a line
            `Blocking condition: <the unanswered question>` under `## Auto Run Result`.

            Do not modify SPEC.md, stories.yaml, epics.yaml, any AGENTS.md, or any existing test
            file in this step.
        expect:
          files: ["{{spec_folder}}/stories/.auto/{{story.id}}-02-plan.md"]
          status_in: [done, blocked]
        retry:
          max: 1
          prompt: "The previous session left no readable marker at {{spec_folder}}/stories/.auto/{{story.id}}-02-plan.md. Do the step again and write that marker last, with status done or status blocked."
          resume_session: false
        escalate_when: "output.status == blocked"
        timeout_min: 45
        gate: liveness

      # --- step 3: implement ---------------------------------------------------------------
      - id: implement
        uses: agent
        with:
          harness: "{{harness}}"
          model: "{{model}}"
          prompt: |
            You are a coding agent working in this repository. The working directory is the
            repository root.

            TASK: execute exactly one build step — step 3, implement.

            Read this file fully and follow it:
              {{skill_dir}}/step-03-implement.md

            Dispatch facts:
              spec folder: {{spec_folder}}
              story id:    {{story.id}}
              story title: {{story.title}}

            Resolve the step file's `{spec_file}` yourself: it is the single file matching
              {{spec_folder}}/stories/{{story.id}}-*.md
            Read it fully before you change anything — it is your only source of truth for what
            to build. If none matches, or more than one does, stop and report blocked.

            How to read that step file:
            - It is an unrendered source. Double-brace placeholders with a leading dot are not
              resolved: use English and plain markdown. The single-brace `workflow.` placeholder
              where the implementation handoff would be is not resolved either — there is no
              subagent to hand off to, so implement the spec yourself, directly.
            - A reference written as a bmad-snapshot link names a file of the same name in
              {{skill_dir}}.
            - IGNORE the `## NEXT` section. This session covers step 3 only. Do not review your
              own work here — step 4 does that.

            Follow the step file's own order: record `baseline_revision` in the spec
            frontmatter, set `status: in-progress`, implement, then run the commands in the
            spec's `## Verification` section and fix what they catch.

            OUTPUT 1 — the implementation in the working tree, plus the story spec updated as
            the step file directs.

            OUTPUT 2 — the step marker. Write it last, overwriting whatever is there:
              {{spec_folder}}/stories/.auto/{{story.id}}-03-implement.md

              ---
              status: done
              ---

              # Step 3 — implement

              ## Auto Run Result

              Status: done
              Spec file: <the path you resolved>

            If verification fails in a way you cannot fix, or the spec contradicts itself, write
            the marker with `status: blocked` and a line `Blocking condition: <one sentence>`
            under `## Auto Run Result`.

            Existing test files are protected: change one only when the story you are building
            declares the behaviour change that requires it, and say so in the story spec. Never
            delete, skip or weaken a failing test to make a command green. Do not modify
            SPEC.md, stories.yaml, epics.yaml or any AGENTS.md.
        expect:
          files: ["{{spec_folder}}/stories/.auto/{{story.id}}-03-implement.md"]
          status_in: [done, blocked]
        retry:
          max: 1
          prompt: "The previous session left no readable marker at {{spec_folder}}/stories/.auto/{{story.id}}-03-implement.md. Finish the implementation and write that marker last, with status done or status blocked."
          resume_session: false
        escalate_when: "output.status == blocked"
        timeout_min: 120
        gate: liveness

      # --- step 4: review ------------------------------------------------------------------
      - id: review
        uses: agent
        with:
          harness: "{{harness}}"
          model: "{{model}}"
          prompt: |
            You are a coding agent working in this repository. The working directory is the
            repository root.

            TASK: execute exactly one build step — step 4, review.

            Read this file fully and follow it:
              {{skill_dir}}/step-04-review.md

            Dispatch facts:
              spec folder: {{spec_folder}}
              story id:    {{story.id}}
              story title: {{story.title}}

            Resolve the step file's `{spec_file}` yourself: it is the single file matching
              {{spec_folder}}/stories/{{story.id}}-*.md
            Read `baseline_revision` from its frontmatter and build the diff from there to the
            working tree, tracked and untracked. Do not stage anything — this is read-only
            inspection.

            How to read that step file:
            - It is an unrendered source. Double-brace placeholders with a leading dot are not
              resolved: use English and plain markdown. The single-brace `workflow.review_layers`
              placeholder is not resolved — there is no reviewer panel to launch, so review the
              diff yourself against these three lenses, one pass each, and collect the findings
              before you triage any of them:
                1. correctness — does the change do what the spec's acceptance criteria say,
                   and does it break anything the diff touches?
                2. edge cases — empty, missing, duplicate, concurrent, and boundary inputs on
                   every path the diff adds or changes.
                3. verification gaps — does a test actually observe each acceptance criterion,
                   and did that test run and pass?
            - The reviewer-prompt files under {{skill_dir}}/review-prompts/ describe lenses 2
              and 3 in full; read them if you want the longer form.
            - IGNORE the `## NEXT` section.

            Then follow the step file's Classify section as written: severity, triage into
            intent_gap / bad_spec / patch / defer / reject, the `## Review Triage Log` entry in
            the spec, and the cascading order for what to do about each.

            OUTPUT 1 — the story spec with the triage log entry appended, the patches applied,
            and frontmatter `status: done` when the review converged.

            OUTPUT 2 — the step marker. Write it last, overwriting whatever is there:
              {{spec_folder}}/stories/.auto/{{story.id}}-04-review.md

              ---
              status: done
              ---

              # Step 4 — review

              ## Auto Run Result

              Status: done
              Spec file: <the path you resolved>

            If the review finds an intent gap, or the repair loop does not converge, write the
            marker with `status: blocked` and a line `Blocking condition: <one sentence>` under
            `## Auto Run Result`.

            Existing test files are protected: change one only when the story declares the
            behaviour change that requires it. Do not modify SPEC.md, stories.yaml, epics.yaml
            or any AGENTS.md.
        expect:
          files: ["{{spec_folder}}/stories/.auto/{{story.id}}-04-review.md"]
          status_in: [done, blocked]
        retry:
          max: 1
          prompt: "The previous session left no readable marker at {{spec_folder}}/stories/.auto/{{story.id}}-04-review.md. Finish the review and write that marker last, with status done or status blocked."
          resume_session: false
        escalate_when: "output.status == blocked"
        timeout_min: 60
        gate: liveness

      # --- the unit gate, and the agent that fixes it ---------------------------------------
      - id: unit-fix
        uses: agent
        with:
          harness: "{{harness}}"
          model: "{{model}}"
          prompt: |
            You are a coding agent working in this repository. The working directory is the
            repository root.

            TASK: leave the unit test suite green.

            First read {{spec_folder}}/stories/.auto/{{story.id}}-05-unit.md if it exists. When
            it carries a `## Verify Failure` section, that section is the orchestrator telling
            you exactly which command failed, with what exit code, and the tail of its output —
            that is the failure to fix, and it means an earlier pass of this step did not
            settle it.

            Now run:
              {{repository.unit_test_command}}

            If it exits zero, change nothing at all and go straight to the marker below.

            If it fails, investigate each failure and classify it before you touch anything:
              - a regression your story's change caused — fix the code;
              - a test that pins behaviour this story deliberately changes — revise exactly the
                assertions that pinned the old behaviour, assert the new behaviour at least as
                thoroughly in the same change, and name the story and the date in the test;
              - a test that is wrong on its own terms — it asserts something impossible to
                observe, or it races — fix the test and say why;
              - not implemented yet, or not this story's work — report blocked, below.
            "The test is in my way" is never a reason. Never delete, skip or weaken a failing
            test to make the command green.

            For context, the story these failures belong to is specified in the single file
            matching {{spec_folder}}/stories/{{story.id}}-*.md — read it before you decide what
            a failure means.

            Re-run the command after your fix. Then write the marker last, overwriting whatever
            is there:
              {{spec_folder}}/stories/.auto/{{story.id}}-05-unit.md

              ---
              status: done
              ---

              # Unit tests

              ## Auto Run Result

              Status: done
              Command: {{repository.unit_test_command}}
              Outcome: <passed untouched | fixed: one line per fix>

            If you have a question you cannot answer from the repository, or a failure you
            cannot classify, write the marker with `status: blocked` and a line
            `Blocking condition: <one sentence>` under `## Auto Run Result` instead of guessing.

            Do not modify SPEC.md, stories.yaml, epics.yaml or any AGENTS.md.
        expect:
          files: ["{{spec_folder}}/stories/.auto/{{story.id}}-05-unit.md"]
          status_in: [done, blocked]
        retry:
          max: 1
          prompt: "The previous session left no readable marker at {{spec_folder}}/stories/.auto/{{story.id}}-05-unit.md. Run the unit tests, settle what they report, and write that marker last, with status done or status blocked."
          resume_session: false
        escalate_when: "output.status == blocked"
        timeout_min: 60
        gate: liveness

      - id: unit
        run: "{{repository.unit_test_command}}"
        on_fail: { redispatch: unit-fix, max: 2 }
        timeout_min: 30
        gate: deterministic

      # --- the quality gate, and the agent that fixes it ------------------------------------
      - id: gate-fix
        uses: agent
        with:
          harness: "{{harness}}"
          model: "{{model}}"
          prompt: |
            You are a coding agent working in this repository. The working directory is the
            repository root.

            TASK: leave the quality gate green.

            First read {{spec_folder}}/stories/.auto/{{story.id}}-06-gate.md if it exists. When
            it carries a `## Verify Failure` section, that section is the orchestrator telling
            you exactly which command failed, with what exit code, and the tail of its output —
            that is the failure to fix, and it means an earlier pass of this step did not
            settle it.

            Now run:
              {{repository.quality_gate_command}}

            If it exits zero, change nothing at all and go straight to the marker below.

            If it fails, investigate each failure and classify it before you touch anything:
              - a regression your story's change caused — fix the code;
              - a check that pins behaviour this story deliberately changes — revise exactly
                what pinned the old behaviour, assert the new behaviour at least as thoroughly
                in the same change, and name the story and the date;
              - a check that is wrong on its own terms, or that races — fix it and say why;
              - not implemented yet, or not this story's work — report blocked, below.
            Never delete, skip, relax or exclude a failing check to make the command green, and
            never lower a threshold the gate enforces.

            For context, the story these failures belong to is specified in the single file
            matching {{spec_folder}}/stories/{{story.id}}-*.md — read it before you decide what
            a failure means.

            Re-run the command after your fix. Then write the marker last, overwriting whatever
            is there:
              {{spec_folder}}/stories/.auto/{{story.id}}-06-gate.md

              ---
              status: done
              ---

              # Quality gate

              ## Auto Run Result

              Status: done
              Command: {{repository.quality_gate_command}}
              Outcome: <passed untouched | fixed: one line per fix>

            If you have a question you cannot answer from the repository, or a failure you
            cannot classify, write the marker with `status: blocked` and a line
            `Blocking condition: <one sentence>` under `## Auto Run Result` instead of guessing.

            Do not modify SPEC.md, stories.yaml, epics.yaml or any AGENTS.md.
        expect:
          files: ["{{spec_folder}}/stories/.auto/{{story.id}}-06-gate.md"]
          status_in: [done, blocked]
        retry:
          max: 1
          prompt: "The previous session left no readable marker at {{spec_folder}}/stories/.auto/{{story.id}}-06-gate.md. Run the quality gate, settle what it reports, and write that marker last, with status done or status blocked."
          resume_session: false
        escalate_when: "output.status == blocked"
        timeout_min: 90
        gate: liveness

      - id: gate
        run: "{{repository.quality_gate_command}}"
        on_fail: { redispatch: gate-fix, max: 2 }
        timeout_min: 45
        gate: deterministic

      - id: commit-guard
        uses: git.commit
        with: { message: "story {{story.id}}: {{story.title}} (orchestrator)" }
        gate: deterministic

  - id: push
    uses: git.push
    with: { branch: "{{branch}}" }
    gate: deterministic

  - id: link
    uses: pr.link
    with: { branch: "{{branch}}" }
    gate: liveness

  - id: done-checkpoint
    uses: checkpoint
    gate: human
