name: task
version: 1
description: one issue-sized change through the plan gate (IMP-002 B1)
inputs:
  project:      { type: project,    required: true }
  repository:   { type: repository, required: true }
  base_branch:  { type: string,     required: true }
  branch:       { type: string,     required: true }
  task_id:      { type: string,     required: true }
  title:        { type: string,     required: true }
  intent:       { type: string,     required: true }   # pasted by the Operator; never ingested from API (IMP-002 B2 deferred)
  artifacts_dir: { type: path,      required: true }   # spec-{{task_id}}-*.md lands here
  harness:      { type: enum, values: [claude, codex, local], default: claude }
  model:        { type: string,     required: false }
steps:
  - id: checkout
    uses: git.worktree
    with: { base: "{{base_branch}}", branch: "{{branch}}" }
    gate: deterministic

  - id: setup
    run: "{{repository.install_command}}"
    timeout_min: 20
    gate: deterministic

  - id: baseline
    run: "{{repository.quality_gate_command}}"
    on_fail: fail
    timeout_min: 45
    gate: deterministic

  - id: plan-and-build
    uses: agent
    with:
      harness: "{{harness}}"
      model: "{{model}}"
      skill: bmad-build-auto
      intent: "{{intent}}"
    prompts:
      dispatch: "Run the skill {skill} with the following intent:\n\n{intent}"
      rendered: >-
        The workflow for skill {skill} is already rendered at {path}. Read that file
        fully and follow it; every step, status and halt this dispatch owes is defined
        there. Do not run render_skill.py yourself.
      answer: 'Answer from the operator to the blocking condition "{condition}": {answer}'
      halt: "Halt after planning."
    expect:
      files: ["{{artifacts_dir}}/spec-{{task_id}}-*.md"]
      success: [done]
      blocked: [blocked]
      checkpoint: [ready-for-dev]
      misconfigured_when:
        - no subagents
        - no stories.yaml found
        - story id not found in stories.yaml
        - version-control metadata not writable
        - no epic spec found
        - unrecognized status in existing story file
        - ambiguous story file match
    retry:
      max: 2
      prompt: "No spec file with a terminal status was found at {{artifacts_dir}}/spec-{{task_id}}-*.md. Finish the task and write that file, or set status: blocked with the reason."
      resume_session: true
    pause_when: always
    timeout_min: 90
    gate: liveness

  - id: verify
    run: "{{repository.unit_test_command}}"
    on_fail: { redispatch: plan-and-build, max: 1 }
    timeout_min: 30
    gate: deterministic

  - id: commit-guard
    uses: git.commit
    with: { message: "{{task_id}}: {{title}} (orchestrator)" }
    gate: deterministic

  - id: push
    uses: git.push
    with: { branch: "{{branch}}" }
    gate: deterministic

  - id: link
    uses: pr.link
    with: { branch: "{{branch}}" }
    gate: liveness
