name: story-run
version: 1
description: one story on its own branch, verified and pushed
inputs:
  project:     { type: project,    required: true }
  repository:  { type: repository, required: true }
  base_branch: { type: string,     required: true }
  branch:      { type: string,     required: true }
  spec_folder: { type: path,       required: true }   # holds stories.yaml and stories/
  story_id:    { type: string,     required: true }
  harness:     { type: enum, values: [claude, codex, local], default: claude }
  model:       { type: string,     required: false }
steps:
  - id: checkout
    uses: git.worktree
    with: { base: "{{base_branch}}", branch: "{{branch}}" }
    gate: deterministic

  - id: setup
    run: "{{repository.install_command}}"
    timeout_min: 20
    gate: deterministic

  - id: baseline
    run: "{{repository.quality_gate_command}}"
    on_fail: fail
    timeout_min: 45
    gate: deterministic

  - id: stories
    for_each: "{{spec_folder}}/stories.yaml"
    as: story
    only: "{{story_id}}"
    steps:
      - id: story
        uses: template
        with:
          name: story
          version: 1
          inputs:
            project: "{{project}}"
            repository: "{{repository}}"
            branch: "{{branch}}"
            spec_folder: "{{spec_folder}}"
            story: "{{story}}"
            harness: "{{harness}}"
            model: "{{model}}"

  - id: push
    uses: git.push
    with: { branch: "{{branch}}" }
    gate: deterministic

  - id: link
    uses: pr.link
    with: { branch: "{{branch}}" }
    gate: liveness
