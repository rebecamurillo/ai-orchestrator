name: golive
version: 1
description: one release checkpoint after every epic of an initiative has merged
inputs:
  project:    { type: project,    required: true }
  repository: { type: repository, required: true }
  # No `base_branch`: this Run checks nothing out (no `git.worktree` row), so no `{{ }}`
  # here needs it declared — the Run still carries one (every Run does), it is simply
  # unused by this file (S5, 2026-09-23; confirmed a worktree-less template plans and
  # runs end to end: `create_run._partition_branch` already falls back to `base_branch`
  # for a plan that declares no branch).
  # `checkpoint` carries no display-text `with` key today — its reason is its row's own
  # label, read off the step id (`application/steps/checkpoint.py`). `holds` is declared
  # for dispatch/documentation only; it is not wired into the checkpoint's reason.
  holds: { type: string, required: false }
steps:
  - id: go-live
    uses: checkpoint
    gate: human
