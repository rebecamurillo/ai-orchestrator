name: staged-initiative-hub
version: 1
description: >-
  staged: every epic of one initiative, in one Run, driven from a hub repository whose
  repos/* submodules are the member repositories' working folders — each story built in three
  agent sessions (plan, implement, review), each on its own model
# family: staged · role: root (on the menu) · method: attach checkout, submodules, epics loop
# called by: — · calls: — · skills: spec-gate (+ BMAD stubs)
# sibling: templates/drafts/initiative-hub.yaml (auto) — differs in: one file, the epics loop
#          holds the epic's steps and a stories loop holds the story's; two more
#          model inputs (`plan_model`, `review_model`, required) beside `model`; two more
#          limits (`plan_timeout_min`, `review_timeout_min`). Every row is the sibling's.
inputs:
  project:           { type: project,    required: true }
  repository:        { type: repository, required: true }  # the hub
  base_branch:        { type: string,     required: true }
  branch:             { type: string,     required: true }  # the initiative branch — shared
                                                              # by the hub and every submodule
  initiative_folder:  { type: path,       required: true }  # holds epics.yaml + one spec
                                                              # folder per epic, all at the hub
  harness:            { type: enum, values: [claude, codex, local], default: claude }
  # Three models. `model` — the Run's own field — is the implementer's, the one that writes
  # code. `plan_model` plans every story and runs each epic's own agent rows (spec-gate,
  # gen-e2e, retro); `review_model` reviews. Both are required: a blank one would fall to the
  # harness's own default model, which a Gateway install may not route at all. Name the
  # strongest model you pay for as `plan_model`.
  model:              { type: string,     required: false }
  plan_model:         { type: string,     required: true }
  review_model:       { type: string,     required: true }
  # The senior a blocked agent row consults before a person is asked (AD-22). Blank:
  # no consult is planned, and every blocked stop parks for a person as before.
  senior_model:       { type: string,     required: false }
  # The Run's time limits, in minutes, passed down to every epic and story: one wall clock per
  # stage (`plan_timeout_min`, `build_timeout_min`, `review_timeout_min`), the implementer's
  # own stall limit (`build_stall_min` — plan and review take their wall clock as the stall
  # limit, since a read-heavy phase writes nothing), and `epic_timeout_min` for the epic's
  # own agent rows. Left blank, each falls to its template default.
  plan_timeout_min:   { type: number,     required: false, default: 45 }
  build_timeout_min:  { type: number,     required: false, default: 180 }
  build_stall_min:    { type: number,     required: false, default: 90 }
  review_timeout_min: { type: number,     required: false, default: 60 }
  epic_timeout_min:   { type: number,     required: false, default: 60 }

# --- the epics.yaml convention this Run's epics loop reads (H3, 2026-09-23) --------------------
# One Run, one branch, every epic sequential — so this file's `epics.yaml` carries more than
# the fan-in path's does. The list-file contract every `epics.yaml` must meet still applies
# (`id`, `title`, `branch`, `spec_folder` — `lists.py::REQUIRED_FIELDS`); `branch` is read by
# the fan-in dispatch path only and is unused here, because every epic works on this Run's
# one `branch` input instead of a branch of its own. The hub-Run fields, read by
# the `epics` loop's steps:
#
#   workdir:         repository-relative path of the epic's member submodule, e.g. repos/api
#   install:         the epic's FULL setup command, `cd` included, e.g.
#                     "cd repos/api && yarn install"
#   test:            the epic's FULL per-story verify command, `cd` included
#   quality_gate:    the epic's FULL end-to-end command, `cd` included
#   done_checkpoint: "true" to stop after this epic — read by the `epics` loop below
#
# `install`/`test`/`quality_gate` are each optional: an entry that omits one plans that row
# `skipped · no command` (AD-7) — never a plan-time error. That is exactly why every command
# an epic step runs is the bare field (`run: "{{install}}"`) and never a template-built command
# (`run: "cd {{workdir}} && {{install}}"`): `cd {{workdir}} && ` with an unbound trailing
# field is not an empty string, so it would never be skipped and would run a bare `cd` as a
# unit test command instead of skipping cleanly. The whole command, `cd` included, is
# `epics.yaml`'s own data — the Operator who writes the entry is the one who knows the
# member repository's own layout, and the Template never guesses it.
steps:
  # `mode: attach` is what makes this Run work *on* the initiative branch rather than be
  # given a fresh ordinal of it: every submodule checkout below is cut from this same name,
  # by its exact spelling, because `git.submodule`'s own branch is exempt from allocation too
  # (AD-7, AD-14) — one declared name, taken exactly, on both sides of the gitlink.
  - id: checkout
    role: deterministic
    uses: git.worktree
    with: { base: "{{base_branch}}", branch: "{{branch}}", mode: attach }
    gate: deterministic

  - id: setup
    role: deterministic
    run: "{{repository.install_command}}"
    timeout_min: 20
    gate: deterministic

  # The bare form: init + update every `repos/*` submodule this hub declares, so the Run has
  # a workdir to run each epic's steps in before the first one is dispatched.
  - id: submodules
    role: deterministic
    uses: git.submodule
    gate: deterministic

  - id: epics
    for_each: "{{initiative_folder}}/epics.yaml"
    as: epic
    # The stop after one epic: read here, at the loop that owns it, never re-declared as a
    # tail step inside the loop, so one epic costs one checkpoint row and not two.
    pause_after_item_when: "epic.done_checkpoint"
    # parallel: reserved; sequential, list order is the dependency
    bind: { spec_folder: "{{initiative_folder}}/{{epic.spec_folder}}" }
    steps:
      # Create or check out the initiative branch inside this epic's own submodule — cut from
      # `origin/{{branch}}` when the member's remote already holds it, from `{{base_branch}}`
      # otherwise (AD-7, AD-14). Taken exactly, never allocated: it lives in the submodule's own
      # repository, which this Run's allocator cannot reason about.
      - id: branch
        role: deterministic
        uses: git.submodule
        with: { workdir: "{{epic.workdir}}", branch: "{{branch}}", base: "{{base_branch}}" }
        gate: deterministic

      # The whole command, `cd` included, is `epics.yaml`'s own data (see
      # `staged-initiative-hub.yaml`'s header): an entry that leaves this field out plans
      # `skipped · no command`, never a bare shell command reaching for a folder nobody named.
      - id: setup
        role: deterministic
        run: "{{epic.install}}"
        timeout_min: 20
        gate: deterministic

      - id: baseline
        role: deterministic
        run: "{{epic.test}}"
        on_fail: fail
        gate: deterministic

      # No `workdir`: the spec lives at the hub, so this agent runs at the worktree root.
      - id: spec-gate
        role: spec-gate
        uses: agent
        with:
          harness: "{{harness}}"
          model: "{{plan_model}}"
          skill: spec-gate
          args: { folder: "{{spec_folder}}" }
        prompts:
          dispatch: "Run the skill {skill} in folder+id dispatch mode: spec folder {spec_folder}, story id {story_id}."
          rendered: >-
            The workflow for skill {skill} is already rendered at {path}. Read that file
            fully and follow it; every step, status and halt this dispatch owes is defined
            there. Do not run render_skill.py yourself.
          answer: 'Answer from the operator to the blocking condition "{condition}": {answer}'
        expect:
          files: ["{{spec_folder}}/spec-gate-result.md"]
          success: [done]
          blocked: [blocked]
        timeout_min: "{{epic_timeout_min}}"
        stall_min: "{{epic_timeout_min}}"
        gate: liveness

      - id: stories
        for_each: "{{spec_folder}}/stories.yaml"
        as: story
        pause_after_item_when: "story.done_checkpoint"
        steps:
            # Hub-side, no `workdir`: how an Operator's edit to `stories.yaml` or a Story file — or any
            # commit origin's initiative branch received since the last story — reaches this frame. A
            # merge, not a fast-forward: by the second story the local branch is ahead of origin.
            # `commit-story` below keeps the hub tree clean for it.
            - id: sync
              role: deterministic
              uses: git.merge
              with: { from: "{{branch}}" }
              gate: deterministic

            # --- 1. plan ------------------------------------------------------------------------------
            # `workdir` moves the dispatch into the member checkout; `agent_workdir.py::prompt_scope`
            # absolutises `spec_folder` into the dispatch sentence, so the skill reads and writes the
            # spec at the hub while standing in the submodule. `expect.files` stays run-root relative.
            # The marker, not the Story file, is what routes the row: an `answer` archives the row's
            # first matched file to `.answers/`, and that must never be the spec itself.
            - id: plan
              role: plan
              uses: agent
              with:
                harness: "{{harness}}"
                model: "{{plan_model}}"
                skill: staged-plan
                args: { spec_folder: "{{spec_folder}}", story_id: "{{story.id}}" }
                prompt_extra: "{{story.invoke_dev_with}}"
                workdir: "{{epic.workdir}}"
              prompts:
                dispatch: "Run the skill {skill} in folder+id dispatch mode: spec folder {spec_folder}, story id {story_id}."
                rendered: >-
                  The workflow for skill {skill} is already rendered at {path}. Read that file
                  fully and follow it; every step, status and halt this dispatch owes is defined
                  there. Do not run render_skill.py yourself.
                answer: 'Answer from the operator to the blocking condition "{condition}": {answer}'
                halt: "Halt after planning."
              expect:
                files: ["{{spec_folder}}/stories/.auto/{{story.id}}-01-plan.md"]
                success: [done]
                blocked: [blocked]
                checkpoint: [ready-for-dev]
                misconfigured_when:
                  - no stories.yaml found
                  - story id not found in stories.yaml
                  - no epic spec found
                  - ambiguous story file match
                  - missing spec_folder or story_id
              retry:
                max: 1
                # No run-root-relative path here: a resumed session gets this prompt alone, with no
                # dispatch sentence in front of it to absolutise `spec_folder`.
                prompt: "The previous session left no readable plan marker for story {{story.id}} under stories/.auto/ in the spec folder named in the dispatch sentence. Finish the spec and write that marker last, with status done or status blocked."
                resume_session: true
              pause_when: "story.spec_checkpoint"
              consult:
                model: "{{senior_model}}"
                skill: senior-consult
                on: [blocked, protected_path]
                timeout_min: 30
                prompts:
                  dispatch: >-
                    Run the skill {skill}. The agent on story {story_id} (spec folder {spec_folder})
                    stopped at this condition: "{condition}". Write your decision to
                    {decision}.
                  answer: 'Answer from the senior reviewer to the blocking condition "{condition}": {answer}'
              timeout_min: "{{plan_timeout_min}}"
              stall_min: "{{plan_timeout_min}}"
              gate: liveness

            # --- 2. implement -------------------------------------------------------------------------
            - id: implement
              role: implement
              uses: agent
              with:
                harness: "{{harness}}"
                model: "{{model}}"
                skill: staged-implement
                args: { spec_folder: "{{spec_folder}}", story_id: "{{story.id}}" }
                workdir: "{{epic.workdir}}"
              prompts:
                dispatch: "Run the skill {skill} in folder+id dispatch mode: spec folder {spec_folder}, story id {story_id}."
                rendered: >-
                  The workflow for skill {skill} is already rendered at {path}. Read that file
                  fully and follow it; every step, status and halt this dispatch owes is defined
                  there. Do not run render_skill.py yourself.
                answer: 'Answer from the operator to the blocking condition "{condition}": {answer}'
                # Sent in front of the dispatch sentence only on the fresh dispatch that follows a
                # `verify` failure (FR-10); the skill's "Sent back" section is what acts on it.
                redispatch: |
                  YOU ARE BACK IN THIS STEP BECAUSE VERIFICATION FAILED. A previous session of this
                  step implemented the story and reported done; the orchestrator then ran the
                  repository's verify command and it failed:
                    Command:   {command}
                    Exit code: {code}
                    Output tail:
                  {tail}
                  Follow the skill's "Sent back" section: that failure, nothing else.
              expect:
                files: ["{{spec_folder}}/stories/.auto/{{story.id}}-02-implement.md"]
                success: [done]
                blocked: [blocked]
                misconfigured_when:
                  - spec file missing or ambiguous
                  - missing spec_folder or story_id
              retry:
                max: 1
                prompt: "The previous session left no readable implement marker for story {{story.id}} under stories/.auto/ in the spec folder named in the dispatch sentence. Finish the implementation, run the spec's Verification commands, and write that marker last, with status done or status blocked."
                resume_session: true
              consult:
                model: "{{senior_model}}"
                skill: senior-consult
                on: [blocked, protected_path]
                timeout_min: 30
                prompts:
                  dispatch: >-
                    Run the skill {skill}. The agent on story {story_id} (spec folder {spec_folder})
                    stopped at this condition: "{condition}". Write your decision to
                    {decision}.
                  answer: 'Answer from the senior reviewer to the blocking condition "{condition}": {answer}'
              timeout_min: "{{build_timeout_min}}"
              stall_min: "{{build_stall_min}}"
              gate: liveness

            # --- 3. verify (deterministic; a failure sends the implementer back to its own breakage) --
            # The full command, `cd` included, is the epic's own data (`staged-initiative-hub.yaml`'s
            # header): `shell` rows take no `workdir`, so the passed-down `{{epic.test}}` scopes itself.
            - id: verify
              role: verify
              run: "{{epic.test}}"
              on_fail:
                redispatch: implement
                max: 2
                consult:
                  model: "{{senior_model}}"
                  skill: senior-consult
                  timeout_min: 30
                  prompts:
                    dispatch: |
                      Run the skill {skill}. The implementer on story {story_id} (spec folder {spec_folder})
                      reported done, and the member repository's verify command still fails after its
                      redispatches were used up:
                        Command:   {command}
                        Exit code: {code}
                        Output tail:
                      {tail}
                      The tail of the implementer's last session log:
                      {agent_log}
                      Diagnose the failure and write your decision to {decision}.
                    answer: |
                      The senior reviewer diagnosed the failing verification ({condition}):
                      {answer}
              timeout_min: 30
              gate: deterministic

            # --- 4. review ----------------------------------------------------------------------------
            - id: review
              role: review
              uses: agent
              with:
                harness: "{{harness}}"
                model: "{{review_model}}"
                skill: staged-review
                args: { spec_folder: "{{spec_folder}}", story_id: "{{story.id}}" }
                workdir: "{{epic.workdir}}"
              prompts:
                dispatch: "Run the skill {skill} in folder+id dispatch mode: spec folder {spec_folder}, story id {story_id}."
                rendered: >-
                  The workflow for skill {skill} is already rendered at {path}. Read that file
                  fully and follow it; every step, status and halt this dispatch owes is defined
                  there. Do not run render_skill.py yourself.
                answer: 'Answer from the operator to the blocking condition "{condition}": {answer}'
              expect:
                files: ["{{spec_folder}}/stories/.auto/{{story.id}}-03-review.md"]
                success: [done]
                blocked: [blocked]
                misconfigured_when:
                  - spec file missing or ambiguous
                  - missing spec_folder or story_id
              retry:
                max: 1
                prompt: "The previous session left no readable review marker for story {{story.id}} under stories/.auto/ in the spec folder named in the dispatch sentence. Finish the review at the tier the spec names, re-run the spec's Verification commands, and write that marker last, with status done or status blocked."
                resume_session: true
              consult:
                model: "{{senior_model}}"
                skill: senior-consult
                on: [blocked, protected_path]
                timeout_min: 30
                prompts:
                  dispatch: >-
                    Run the skill {skill}. The agent on story {story_id} (spec folder {spec_folder})
                    stopped at this condition: "{condition}". Write your decision to
                    {decision}.
                  answer: 'Answer from the senior reviewer to the blocking condition "{condition}": {answer}'
              timeout_min: "{{review_timeout_min}}"
              stall_min: "{{review_timeout_min}}"
              gate: liveness

            # `workdir`: the protected-path check reads this frame's agent range from the tree the
            # three stages dispatched in, and `git.commit`'s `workdir` form commits only that submodule.
            - id: commit-guard
              role: deterministic
              uses: git.commit
              with: { workdir: "{{epic.workdir}}", message: "story {{story.id}}: {{story.title}} (orchestrator)" }
              gate: deterministic

            # Hub-side, no `workdir`: the Story file and the three markers the stages wrote at the hub,
            # committed by the story that wrote them. Ends `done · no changes` when nothing moved.
            - id: commit-story
              role: deterministic
              uses: git.commit
              with: { message: "story {{story.id}}: {{story.title}} — spec (orchestrator)" }
              gate: deterministic

      # Unlike `spec-gate` and `retro`, this one carries `workdir`: the tests it writes are the
      # member repository's own, so it dispatches inside the submodule and its Story-shaped
      # write lands there rather than at the hub.
      - id: gen-e2e
        role: e2e-gen
        uses: agent
        with:
          harness: "{{harness}}"
          model: "{{plan_model}}"
          skill: bmad-qa-generate-e2e-tests
          args: { folder: "{{spec_folder}}" }
          workdir: "{{epic.workdir}}"
        prompts:
          dispatch: "Run the skill {skill} in folder+id dispatch mode: spec folder {spec_folder}, story id {story_id}."
          rendered: >-
            The workflow for skill {skill} is already rendered at {path}. Read that file
            fully and follow it; every step, status and halt this dispatch owes is defined
            there. Do not run render_skill.py yourself.
          answer: 'Answer from the operator to the blocking condition "{condition}": {answer}'
        timeout_min: "{{epic_timeout_min}}"
        stall_min: "{{epic_timeout_min}}"
        gate: liveness

      - id: commit-e2e
        role: deterministic
        uses: git.commit
        with: { workdir: "{{epic.workdir}}", message: "e2e: generated tests (orchestrator)" }
        gate: deterministic

      - id: e2e
        role: e2e
        run: "{{epic.quality_gate}}"
        on_fail: { redispatch: gen-e2e, max: 2 }
        timeout_min: 45
        gate: deterministic

      # No `workdir`: the retrospective writes into the spec folder, which lives at the hub.
      - id: retro
        role: retro
        uses: agent
        with:
          harness: "{{harness}}"
          model: "{{plan_model}}"
          skill: bmad-retrospective
          args: { folder: "{{spec_folder}}" }
          prompt_extra: >-
            Run the skill headless (-H): this dispatch has no one to answer its questions.
            When RETROSPECTIVE.md is final, write the verdict last to {{spec_folder}}/stories/.auto/retro.md,
            overwriting whatever is there, and never in place of that document. Its frontmatter `status`
            is exactly one of `accepted`, `accepted-with-open-items` or `rejected`, as recorded in
            RETROSPECTIVE.md; a human decision that overrides the machine verdict is the verdict, and
            RETROSPECTIVE.md's own `verdict` is updated to it first. Under the frontmatter write a
            `## Auto Run Result` section with a `Status:` line. For `rejected`, add a
            `Blocking condition:` line naming every finding that stands, each with its source,
            separated by `; `, then the same findings as a bulleted list.
        prompts:
          dispatch: "Run the skill {skill} in folder+id dispatch mode: spec folder {spec_folder}, story id {story_id}."
          rendered: >-
            The workflow for skill {skill} is already rendered at {path}. Read that file
            fully and follow it; every step, status and halt this dispatch owes is defined
            there. Do not run render_skill.py yourself.
          answer: 'Answer from the operator to the blocking condition "{condition}": {answer}'
        # The verdict is routed on its own marker, never on RETROSPECTIVE.md: an `answer` archives the
        # row's first matched file, and that must not be the document.
        expect:
          files: ["{{spec_folder}}/stories/.auto/retro.md"]
          success: [accepted, accepted-with-open-items]
          blocked: [rejected]
        retry:
          max: 1
          prompt: "The previous session left a retro marker whose status is not accepted, accepted-with-open-items or rejected. Write {{spec_folder}}/stories/.auto/retro.md last, with status set to the verdict recorded in RETROSPECTIVE.md, spelled exactly as one of those three."
          resume_session: true
        timeout_min: "{{epic_timeout_min}}"
        stall_min: "{{epic_timeout_min}}"
        gate: liveness

      # Hub-side, no `workdir`: stages the spec folder (the spec-gate result, the retro's own
      # output, anything a story left uncommitted at the hub) and everything else uncommitted at
      # the worktree root, then commits it in one row. Each story's own hub-side writes already
      # reached a commit at its `commit-story`; this is the epic's sweep.
      - id: commit-retro
        role: deterministic
        uses: git.commit
        with: { message: "retro: epic retrospective (orchestrator)" }
        gate: deterministic

      - id: push-code
        role: deterministic
        uses: git.push
        with: { workdir: "{{epic.workdir}}", branch: "{{branch}}" }
        gate: deterministic

      # Bring in whatever origin's initiative branch received during this epic before pushing,
      # so `push-hub` is rejected only by a push that lands inside the window between these two
      # rows — then the existing `retry` (sync first) is the right stop. No `workdir` form exists
      # for `git.merge`, so `push-code` keeps its own behaviour; the member's branch is written
      # by this Run alone.
      - id: merge-hub
        role: deterministic
        uses: git.merge
        with: { from: "{{branch}}" }
        gate: deterministic

      - id: push-hub
        role: deterministic
        uses: git.push
        with: { branch: "{{branch}}" }
        gate: deterministic

  - id: metrics
    role: deterministic
    uses: metrics.analyse
