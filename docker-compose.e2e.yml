# ai-orchestrator — the overlay that makes the e2e gate a stack of its own.
#
# `make e2e` merges this over `docker-compose.yml` under the project name `aio-e2e`, so the
# gate gets its own containers, its own `pgdata`, `work` and `agent-home` volumes and its own
# database, and ends with `docker compose down -v`. The Projects the suite never deletes, the
# bare fixture repositories it makes and the base clones the backend cuts from them all die
# with the run; none of it can reach `aio-dev`.
#
# Two things have to be said here rather than in `.env.e2e`, because `docker-compose.yml`
# writes them literally and a frozen test pins them there:
#
#   - postgres publishes `127.0.0.1:5432:5432`, so a second project refuses to start while
#     the dev stack holds the port. `E2E_POSTGRES_PORT` moves the published half; the
#     container half stays 5432, which is what `DATABASE_URL` names inside the network.
#   - backend-api reads `env_file: .env` — the dev environment. The gate's stack must read
#     `.env.e2e`, or it would reach the dev database with the dev credentials and the whole
#     point of this file would be lost. `required: true`: a missing `.env.e2e` refuses rather
#     than starting a container configured from nothing (hard rule 7).
#
# `!override` replaces the list it is written on. Without it compose *appends*, both port
# lines would be published and the collision this file exists to remove would come back.
#
# The two application ports need nothing here: `docker-compose.yml` already publishes
# `${BACKEND_API_PORT}` and `${WEB_CLIENT_PORT}`, and `.env.e2e` gives them values of their own.

services:
  postgres:
    ports: !override
      - "127.0.0.1:${E2E_POSTGRES_PORT:-55432}:5432"
    restart: "no"

  backend-api:
    env_file: !override
      - path: .env.e2e
        required: true
    restart: "no"
    # Test mode (SPEC CAP-1), and it belongs here rather than in `.env.e2e`: that file is
    # generated once from `.env.example` by `scripts/generate-env.sh` and never rewritten,
    # so a checkout whose `.env.e2e` predates this story would silently run the gate without
    # the scripted `fake` harness. Compose's `environment` wins over `env_file`, so this
    # holds however old the generated file is. The dev stack reads `.env` and is unaffected.
    #
    # `GIT_ALLOW_PROTOCOL: file` (story H5, 2026-09-23) is the one thing the hub-Run e2e
    # fixture needs that no other suite does: `git submodule update --init` refuses the
    # `file` transport for the clones it starts (CVE-2022-39253), even though a direct `git
    # clone file://…` — what every other e2e fixture already relies on — is always allowed.
    # `SubprocessGit.command_environment` mirrors this variable from the backend's own
    # process environment exactly the way it already mirrors `PATH`; it is never a typed
    # `Settings` field (AD-20 governs an application *setting*, and this is a passthrough),
    # and it is declared only here — never in `.env.example` or `docker-compose.yml` — so a
    # real deployment's environment never carries it and the CVE guard stays exactly as git
    # ships it for every Operator's own stack.
    #
    # `INIT_TEMPLATE: e2e-repo-init` (Operator ruling 2026-10-15: no test reads, runs or
    # asserts on the shipped `templates/*.yaml`): `POST /repositories/{id}/init` dispatches
    # whatever this names, and the e2e suite stores its own repo-init fixture under this
    # name before it calls the endpoint. The `e2e-api` job writes the same value into its
    # `.env`; production keeps `.env.example`'s default.
    environment:
      ORCH_TEST_MODE: "1"
      GIT_ALLOW_PROTOCOL: "file"
      INIT_TEMPLATE: "e2e-repo-init"
    # The gate's stack is the one that never runs a real agent (the scripted `fake`
    # harness), so the hardening the base file gives up for sudo lives here: the image's
    # `sudo` binary is inert under `no-new-privileges`, and nothing in this stack misses
    # it. `tests/unit/test_compose_sandbox.py` asserts both halves of that split.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
