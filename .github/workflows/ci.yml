# ai-orchestrator — the gates of AGENTS.md "Commands", run on every push.
#
# AD-18 fixes the order: lint → unit → e2e-api → e2e-ui, chained by `needs:` so a red gate
# stops the ones after it instead of burning runners on a build that is already refused.
# Every job's gate is a `make` target — the same line the Operator types — so a pipeline that
# passes and a shell that fails is a contradiction, not a configuration difference.
#
# The pipeline holds no credential. `cp .env.example .env` gives the e2e job the committed
# placeholders, which is all a stack with no gateway and no repository to clone needs; a
# secret would have to be added here to be leaked here, and none is (AD-5).
#
# Actions are pinned to a commit: a tag can be moved under the pipeline, a commit cannot.
# `backend-api/tests/unit/test_ci_workflow.py` asserts the job graph, the pins and the
# targets, because nothing in the repository can run this file locally.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

# a second push to the same branch supersedes the first; the gates are all-or-nothing
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # corepack materialises the pnpm version pinned in web-client/package.json; on a runner
  # there is no one to answer its download prompt
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend-api/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          set -euo pipefail
          corepack enable
          # The pnpm pin lives in web-client/package.json. corepack resolves
          # `packageManager` from the working directory, and this repository has no root
          # package.json, so at the workspace root corepack activates its own bundled
          # default instead -- which `pnpm --dir web-client` then rejects as
          # ERR_PNPM_BAD_PM_VERSION the moment corepack's default drifts past the pin.
          # Activate the pinned version explicitly, read from the pin itself so this
          # never becomes a second copy to drift.
          version="$(node -p "require('$GITHUB_WORKSPACE/web-client/package.json').packageManager.split('@')[1]")"
          test -n "$version"
          corepack prepare "pnpm@$version" --activate
          pnpm --version
      - name: Locate the pnpm store
        id: pnpm
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web-client/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install web-client dependencies
        run: pnpm --dir web-client install --frozen-lockfile
      - name: Gate
        run: make lint
      - name: Contract drift
        # `make lint` proves schema.d.ts matches contracts/openapi.json; only re-exporting
        # from the Pydantic source proves the contract itself is current (AD-3)
        run: |
          make openapi
          git diff --exit-code contracts web-client/src/api/schema.d.ts

  unit:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover compares against the base branch; a shallow clone has no base branch
          # and would report a diff of nothing at all
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend-api/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          set -euo pipefail
          corepack enable
          # The pnpm pin lives in web-client/package.json. corepack resolves
          # `packageManager` from the working directory, and this repository has no root
          # package.json, so at the workspace root corepack activates its own bundled
          # default instead -- which `pnpm --dir web-client` then rejects as
          # ERR_PNPM_BAD_PM_VERSION the moment corepack's default drifts past the pin.
          # Activate the pinned version explicitly, read from the pin itself so this
          # never becomes a second copy to drift.
          version="$(node -p "require('$GITHUB_WORKSPACE/web-client/package.json').packageManager.split('@')[1]")"
          test -n "$version"
          corepack prepare "pnpm@$version" --activate
          pnpm --version
      - name: Locate the pnpm store
        id: pnpm
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web-client/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install web-client dependencies
        run: pnpm --dir web-client install --frozen-lockfile
      - name: Gate
        run: make test
      - name: Changed lines
        # `make test` wrote backend-api/coverage.xml; this reads it
        run: make coverage DIFF_COVER_BASE=origin/${{ github.base_ref || github.event.repository.default_branch }}

  e2e-api:
    needs: unit
    runs-on: ubuntu-latest
    # 20 for the gate itself; the rest is the durability step's own stack, which builds the
    # backend image before it can kill a container of it
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend-api/uv.lock
      - name: Fill the environment contract with its committed placeholders
        # Two values cannot be the committed ones. ORCHESTRATOR_SECRET_KEY must be a valid
        # Fernet key, and `change-me-fernet-key` is not one: the Projects API builds a Fernet
        # per request (api/providers.py), so with the placeholder every write answers 500 and
        # the suite tests nothing. Mint one for this run — random, never leaves the runner,
        # torn down with the volume afterwards.
        #
        # POSTGRES_DB names the database the gate may write to. `tests/e2e` creates Projects,
        # fixture repositories and base clones and removes none of them, so
        # `scripts/check_e2e_target.sh` refuses any database whose name does not end in
        # `_e2e` — here and on a developer's machine alike. This runner's postgres is as
        # disposable as `make e2e`'s, and says so in its name.
        run: |
          cp .env.example .env
          key=$(python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          sed -i "s|^ORCHESTRATOR_SECRET_KEY=.*|ORCHESTRATOR_SECRET_KEY=$key|" .env
          sed -i "s|^POSTGRES_DB=.*|POSTGRES_DB=orchestrator_e2e|" .env
      - name: Start postgres
        run: docker compose up -d --wait postgres
      - name: Start backend-api from source
        # Three contract values name things that exist only inside the compose network, and
        # a run on the runner itself has none of them. DATABASE_URL names the postgres
        # service, so the published port stands in for it; WORK_DIR is `/work`, a named
        # volume the runner has no root to create, so a directory under RUNNER_TEMP stands in
        # for it — the clone check writes base clones there; TEMPLATES_DIR is
        # `/app/templates`, where the Dockerfile copies the shipped Templates, so the
        # repository's own `templates/` stands in for it. Without that last stand-in, seeding
        # reads an absent directory, finds nothing, and every shipped Template answers 404
        # while start-up still reports success.
        run: |
          set -a; . ./.env; set +a
          export DATABASE_URL="postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:5432/$POSTGRES_DB"
          export WORK_DIR="${RUNNER_TEMP:-/tmp}/work"
          mkdir -p "$WORK_DIR"
          export TEMPLATES_DIR="$GITHUB_WORKSPACE/templates"
          test -d "$TEMPLATES_DIR"
          uv run --locked --directory backend-api python -m orchestrator.main > backend-api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          echo "backend-api never answered /healthz on 127.0.0.1:8000" >&2
          cat backend-api.log >&2
          exit 1
      - name: Gate
        # The same three stand-ins as the step above: the suite reads WORK_DIR through
        # `Settings()` to write its own fixture repositories where the backend can clone them
        run: |
          set -a; . ./.env; set +a
          export DATABASE_URL="postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:5432/$POSTGRES_DB"
          export WORK_DIR="${RUNNER_TEMP:-/tmp}/work"
          mkdir -p "$WORK_DIR"
          export TEMPLATES_DIR="$GITHUB_WORKSPACE/templates"
          test -d "$TEMPLATES_DIR"
          export BACKEND_API_URL=http://127.0.0.1:8000
          make e2e-api
      - name: Backend log
        if: failure()
        run: cat backend-api.log
      - name: Stop the stack
        if: always()
        run: docker compose down -v
      - name: Durability proof
        # SPEC CAP-17 / FR-12 / SM-4: the one gate that kills the backend mid-Run and
        # restarts it. It needs a backend it may kill, which means a container — the backend
        # this job started from source above is a process on the runner, so `make e2e-api`
        # deselects the `durability` marker and this step runs it against a compose stack of
        # its own instead (`make e2e`'s stack, marker inverted: own project, own volumes,
        # `down -v` on the way out). It runs after the stack above is stopped so the two
        # never share a port. No credential: `scripts/generate-env.sh e2e` writes the whole
        # environment itself, placeholders included (AD-5).
        run: make durability

  e2e-ui:
    needs: e2e-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          set -euo pipefail
          corepack enable
          # The pnpm pin lives in web-client/package.json. corepack resolves
          # `packageManager` from the working directory, and this repository has no root
          # package.json, so at the workspace root corepack activates its own bundled
          # default instead -- which `pnpm --dir web-client` then rejects as
          # ERR_PNPM_BAD_PM_VERSION the moment corepack's default drifts past the pin.
          # Activate the pinned version explicitly, read from the pin itself so this
          # never becomes a second copy to drift.
          version="$(node -p "require('$GITHUB_WORKSPACE/web-client/package.json').packageManager.split('@')[1]")"
          test -n "$version"
          corepack prepare "pnpm@$version" --activate
          pnpm --version
      - name: Locate the pnpm store
        id: pnpm
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web-client/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install web-client dependencies
        run: pnpm --dir web-client install --frozen-lockfile
      - name: Install the browser the specs drive
        run: pnpm --dir web-client exec playwright install --with-deps chromium
      - name: Gate
        # `make e2e-ui` builds first, then runs Playwright against the built server and a
        # stubbed backend-api — no database and no backend process are needed here
        run: make e2e-ui

  images:
    needs: e2e-ui
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fill the environment contract with its committed placeholders
        # `docker compose build` interpolates the file before it reads the build stanzas,
        # and the `${VAR:?}` guards refuse an unset variable (hard rule 7)
        run: cp .env.example .env
      - name: Gate
        # The only gate that proves a Dockerfile still builds. `make up` builds them too,
        # but nothing before this job runs it: every earlier gate runs from source.
        run: make images
