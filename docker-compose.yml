# ai-orchestrator — the compose stack.
#
# The whole MVP: `web-client`, `backend-api` and `postgres`, with the Gateway (LiteLLM),
# the tracing server (Langfuse) and the model server running on the host outside compose
# and documented in `host/README.md` (AD-20, NFR-7).
#
# Configuration is the environment (AD-20): every value below comes from `.env`, which is
# a copy of the committed `.env.example` contract. No credential is written into this file.
#
# The contract is two-tier (Operator decision 2026-09-20, two-tier configuration contract;
# reaffirmed 2026-09-30). Fail-closed is the *secret* tier's property: ORCHESTRATOR_TOKEN,
# ORCHESTRATOR_SESSION_SECRET and POSTGRES_PASSWORD use `${VAR:?...}` and the project
# refuses to render without them. Everything else uses `${VAR:-default}`, whose fallback is
# the value `.env.example` documents, so this stack comes up on a `.env` holding three
# lines. Bare `${VAR}` is still forbidden either way: it interpolates to an empty string
# when unset, and a service would start misconfigured rather than refusing (hard rule 7).
# `backend-api/tests/unit/test_compose_fails_closed.py` pins both halves — the `:?` set by
# enumeration, and every `:-` default against the contract's value.
#
# Credentials stop at the process that needs them (AD-5): `backend-api` is handed the whole
# contract through `env_file`, and `web-client` is handed four named variables. Nothing
# gives the browser's origin the git token, the spend key or the database URL.
#
#   cp .env.example .env          # once, then fill it in
#   make up                       # build and start all three services
#   make down                     # stop them; the named volumes survive

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, copied from .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
    ports:
      # loopback only: the database is reached from the compose network and from this
      # machine's own tooling, never from another host
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 declares its volume at /var/lib/postgresql and sets
      # PGDATA=/var/lib/postgresql/18/docker — the pre-18 /var/lib/postgresql/data would
      # mount a directory the image no longer writes to, and the data would not persist
      - pgdata:/var/lib/postgresql
    healthcheck:
      # $$ defers the expansion to the container's shell, which has the variables above
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend-api:
    build:
      # the repository root: the image needs `backend-api/` and the shared `scripts/harness/`
      context: .
      dockerfile: backend-api/Dockerfile
    env_file:
      # the one process that holds every credential (AD-5). `required: false` so that
      # `docker compose config` still validates on a machine that has not been set up —
      # a missing contract is then reported by the application, naming the fields.
      - path: .env
        required: false
    extra_hosts:
      # LiteLLM, Langfuse and the model server run on the host, not in compose (AD-11)
      - "host.docker.internal:host-gateway"
    ports:
      # loopback only: the API is reached from the compose network and from this machine's
      # own tooling (`make e2e-api`, `curl`), never from another host
      - "127.0.0.1:${BACKEND_API_PORT:-8000}:${BACKEND_API_PORT:-8000}"
    volumes:
      # base clones, worktrees and step logs
      - work:${WORK_DIR:-/work}
      # ~/.claude ~/.codex ~/.config/opencode: the harness configs and the BMAD skill stubs
      - agent-home:${AGENT_HOME:-/home/agent}
    # DISABLED to allow container to install apt packages in a target repository's worktree
    # cap_drop:
    #   - ALL
    # security_opt:
    #   - no-new-privileges:true
    # the worktrees and the harness configs are written at run time (NFR-3)
    read_only: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # $$ defers the expansion to the container's shell, which has the contract
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${BACKEND_API_PORT}/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      # the first start runs `alembic upgrade head` before the socket is bound
      start_period: 60s
    restart: unless-stopped

  web-client:
    build:
      # its own context: the component needs nothing from the rest of the repository
      context: ./web-client
      dockerfile: Dockerfile
    environment:
      # exactly five (AD-5). Never GITHUB_TOKEN, never LITELLM_SPEND_KEY, never DATABASE_URL.
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:?set it in .env, copied from .env.example}
      ORCHESTRATOR_SESSION_SECRET: ${ORCHESTRATOR_SESSION_SECRET:?set it in .env, copied from .env.example}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend-api:8000}
      WEB_CLIENT_PORT: ${WEB_CLIENT_PORT:-4321}
      # the one bare reference here: empty is a defined value for this variable, so there is
      # no misconfiguration for `:?` to catch
      ROOT_TEMPLATES: ${ROOT_TEMPLATES:-}
    ports:
      # loopback only: one operator at one machine (PRD §12); reaching it from elsewhere is
      # a host concern, the same posture NFR-4 takes for egress
      - "127.0.0.1:${WEB_CLIENT_PORT:-4321}:${WEB_CLIENT_PORT:-4321}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Astro writes its session store under the working directory
    read_only: false
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      # node, not curl: the slim base carries no HTTP client, and adding one to probe a
      # server that is already node would be a package installed for a single request.
      # `/login` is the one route that answers without a session (1.5).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.WEB_CLIENT_PORT || 4321) + '/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  # /work — base clones, worktrees, logs (AD-14)
  work:
  # the agent's home — harness configs and the BMAD skill stubs (AD-16). Seeded from the
  # backend image the first time it is created, and not backed up (spine Operations).
  agent-home:
