# ai-orchestrator — the compose stack.
#
# Story 1.2 lands the database only. `web-client` and `backend-api` need images that do not
# exist yet; story 1.6 adds them together with their Dockerfiles, and `make up` refuses
# until then rather than half-working.
#
# Configuration is the environment (AD-20): every value below comes from `.env`, which is
# a copy of the committed `.env.example` contract. No credential is written into this file.
#
# Every reference uses the `${VAR:?...}` form. Bare `${VAR}` interpolates to an empty
# string when the variable is unset, and postgres would start misconfigured rather than
# refusing — a gate that fails open (hard rule 7).
#
#   cp .env.example .env          # once, then fill it in
#   docker compose up -d postgres

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env, copied from .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, copied from .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env, copied from .env.example}
    ports:
      # loopback only: the database is reached from the compose network and from this
      # machine's own tooling, never from another host
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 declares its volume at /var/lib/postgresql and sets
      # PGDATA=/var/lib/postgresql/18/docker — the pre-18 /var/lib/postgresql/data would
      # mount a directory the image no longer writes to, and the data would not persist
      - pgdata:/var/lib/postgresql
    healthcheck:
      # $$ defers the expansion to the container's shell, which has the variables above
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
