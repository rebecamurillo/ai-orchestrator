# Alembic configuration for backend-api.
#
# There is no `sqlalchemy.url` here on purpose: the URL carries POSTGRES_PASSWORD, and a
# credential never enters a committed file (hard rule 5). `alembic/env.py` reads it from
# the typed settings module instead — the same `DATABASE_URL` the application uses (AD-20).
#
# Logging is not configured here either: `env.py` deliberately does not call `fileConfig`,
# so migrations log through the same structlog JSON handler as the rest of the process.

[alembic]
script_location = alembic
prepend_sys_path = . src
path_separator = space
# Alembic manages schema `public` only; schema `dbos` is the engine's (AD-6).
version_table = alembic_version
version_table_schema = public
