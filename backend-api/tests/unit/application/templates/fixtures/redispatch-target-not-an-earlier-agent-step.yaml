name: redispatching
version: 1
steps:
  - id: verify
    uses: shell
    with:
      command: make test
    on_fail:
      redispatch: build
      max: 1
    gate: deterministic
  - id: build
    uses: agent
    with:
      harness: claude
      skill: bmad-build-auto
    prompts:
      dispatch: "Run the skill {skill}: spec folder {spec_folder}, story id {story_id}."
      rendered: "The workflow for skill {skill} is rendered at {path}; read and follow it."
    gate: liveness
