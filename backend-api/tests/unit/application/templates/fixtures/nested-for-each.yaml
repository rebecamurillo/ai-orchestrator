# story 2, 2026-11-06 (AD-15 amendment): a loop inside a loop is valid; the third level is refused.
name: nested
version: 1
inputs:
  spec_folder:
    type: path
    required: true
steps:
  - id: outer
    for_each: "{{spec_folder}}/a.yaml"
    as: one
    steps:
      - id: inner
        for_each: "{{spec_folder}}/b.yaml"
        as: two
        steps:
          - id: deepest
            for_each: "{{spec_folder}}/c.yaml"
            as: three
            steps:
              - id: sync
                uses: git.sync
                gate: deterministic
