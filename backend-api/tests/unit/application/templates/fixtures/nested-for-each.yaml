name: nested
version: 1
inputs:
  spec_folder:
    type: path
    required: true
steps:
  - id: outer
    for_each: "{{spec_folder}}/a.yaml"
    as: one
    steps:
      - id: inner
        for_each: "{{spec_folder}}/b.yaml"
        as: two
        steps:
          - id: sync
            uses: git.sync
            gate: deterministic
