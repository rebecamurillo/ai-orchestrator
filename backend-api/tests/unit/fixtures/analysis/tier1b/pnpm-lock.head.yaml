      react: '>=18'

  left-pad@1.3.0:
    resolution: {integrity: sha512-dddd}

  react@18.2.0:
    resolution: {integrity: sha512-bbbb}

  zod@3.23.8:
    resolution: {integrity: sha512-eeee}

snapshots:

  '@scope/pkg@1.0.0(react@18.2.0)':
    dependencies:
      react: 18.2.0

  left-pad@1.3.0: {}

  react@18.2.0: {}

