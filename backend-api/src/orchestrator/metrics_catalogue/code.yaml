- id: code.linter_warnings_new
  label: new linter warnings
  group: code
  level: A
  scopes:
  - run
  - repository
  unit: count
  source: The repository's own commands.lint, run at base and at head.
  component_of: null
  additive: false
  missing_words:
  - n/a
  - not run
  - partial
  limits: Matched on path after renames and message, line and column ignored; a message that changes wording
    counts as new; no rate is computed.
  fingerprint_group: true
  methods:
  - n: 1
    description: 'commands.lint runs in a checkout of base and of head; each output line shaped path:line:col:
      message is a finding, matched on (path after renames, message); the count is head minus base as
      a multiset.'
    parameters:
      line_patterns:
      - ^(?P<path>[^\s:()][^:()]*?):(?P<line>\d+):(?:(?P<col>\d+):)?\s*(?P<message>.+)$
      - ^(?P<path>[^\s()]+)\((?P<line>\d+),(?P<col>\d+)\):\s*(?P<message>.+)$
      output_tail_chars: 1000000
      timeout_setting: ANALYSIS_COMMAND_TIMEOUT_MIN
