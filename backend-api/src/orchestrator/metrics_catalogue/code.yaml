- id: code.lines_added
  label: lines added, by class
  group: code
  level: H
  scopes:
  - run
  - repository
  unit: lines
  source: 'Scratch clone of the Run''s pushed head: git numstat, name-status and diff against the base.'
  component_of: null
  additive: false
  missing_words:
  - not run
  - partial
  limits: 'A size row and the stated denominator of every rate: it has no rate of its own. Counts are
    summed and every rate is recomputed from the summed totals; rates are never summed.'
  fingerprint_group: true
  methods:
  - n: 1
    description: 'Added lines from git numstat, summed per file class: the declaration''s globs, then
      the convention patterns in precedence order; the first match wins. Production lines are the denominator
      of every rate; test lines of the test-class type escapes.'
    parameters:
      precedence:
      - generated_or_artefact
      - test_e2e
      - test_unit
      - test_unclassified
      - docs
      - configuration
      - production
      generated:
      - _bmad-output/**
      - dist/**
      - build/**
      - '*.min.js'
      - '**/schema.d.ts'
      - contracts/openapi.json
      - '*.lock'
      - package-lock.json
      - pnpm-lock.yaml
      - npm-shrinkwrap.json
      - go.sum
      hub:
      - initiatives/**
      - planning/**
      e2e:
      - tests/e2e/**
      - e2e/**
      - '*.e2e.*'
      - playwright/**
      unit:
      - '*.test.*'
      - '*.spec.*'
      - test_*.py
      - '*_test.py'
      - '*_test.go'
      - tests/unit/**
      unclassified:
      - tests/**
      - test/**
      docs:
      - '*.md'
      - docs/**
      configuration:
      - '*.json'
      - '*.yaml'
      - '*.yml'
      - '*.toml'
      - '*.ini'
      - .env*
      - Dockerfile*
      - Makefile
      lock_files:
      - '*.lock'
      - package-lock.json
      - pnpm-lock.yaml
      - npm-shrinkwrap.json
      - go.sum
