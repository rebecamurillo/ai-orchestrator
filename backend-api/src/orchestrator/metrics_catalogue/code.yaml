- id: code.duplication_added
  label: duplicated lines added
  group: code
  level: A
  scopes:
  - run
  - repository
  unit: lines
  source: jscpd over the changed files.
  component_of: null
  additive: false
  missing_words:
  - not run
  - raw only
  - small change
  - partial
  limits: Counts are summed and every rate is recomputed from the summed totals; rates are never summed.
    Below 200 added production lines the row reads small change.
  fingerprint_group: true
  methods:
  - n: 1
    description: jscpd runs on the head's changed production files; the count is the distinct added lines
      that lie inside a clone fragment, a clone that involves no added line counting nothing.
    parameters:
      jscpd_command:
      - --reporters
      - sarif,json
      - --output
      - '{dir}'
      - '{files}'
      timeout_min: 10
      small_change_lines: 200
      rate_min_lines: 50
      per_lines: 100
- id: code.functions_over_cyclomatic
  label: functions above the cyclomatic threshold · worst
  group: code
  level: A
  scopes:
  - run
  - repository
  unit: count
  source: lizard over the changed files.
  component_of: null
  additive: false
  missing_words:
  - not run
  - partial
  limits: The count is summed over the repositories and the worst is the larger of their values; no rate
    is computed.
  fingerprint_group: true
  methods:
  - n: 1
    description: lizard (`--csv`) measures the functions of the head's changed files; the count is those
      whose line range contains an added line and whose cyclomatic complexity is above 15, and the
      worst is the largest of them (0 when none is above).
    parameters:
      threshold: 15
      lizard_command:
      - --csv
      - '{files}'
      timeout_min: 10
      combine:
        count: sum
        worst: max
- id: code.functions_over_cognitive
  label: functions above the cognitive threshold · worst
  group: code
  level: A
  scopes:
  - run
  - repository
  unit: count
  source: lizard over the changed files.
  component_of: null
  additive: false
  missing_words:
  - not run
  - n/a
  - partial
  limits: The count is summed over the repositories and the worst is the larger of their values; no rate
    is computed. A language lizard reports no cognitive value for reads n/a.
  fingerprint_group: true
  methods:
  - n: 1
    description: lizard (`--csv -Ecognitive`) measures the functions of the head's changed files; the count
      is those whose line range contains an added line and whose cognitive complexity is above 15,
      and the worst is the largest of them (0 when none is above).
    parameters:
      threshold: 15
      lizard_cognitive_command:
      - --csv
      - -Ecognitive
      - '{files}'
      timeout_min: 10
      combine:
        count: sum
        worst: max
