- id: code.possible_secrets
  label: possible secrets added
  group: code
  level: H
  scopes:
  - run
  - repository
  unit: count
  source: gitleaks over a scratch folder holding only the lines the change adds.
  component_of: null
  additive: false
  missing_words:
  - not run
  - raw only
  - partial
  limits: Counts are summed and every rate is recomputed from the summed totals; rates are never summed.
  fingerprint_group: true
  methods:
  - n: 1
    description: gitleaks scans a folder holding, per changed file, only the head's added lines, with
      its report redacted; the count is the results in its SARIF, which is stored as the analysis artefact.
      The added lines sit one level below the scanned root and inline allows are ignored, so the change
      cannot supply gitleaks' configuration, ignore list or allow comments.
    parameters:
      command:
      - gitleaks
      - dir
      - '{folder}'
      - --report-format
      - sarif
      - --report-path
      - '{file}'
      - --redact
      - --no-banner
      - --ignore-gitleaks-allow
      added_files_folder: files
      timeout_min: 10
      redact: true
      rate_min_lines: 50
      per_lines: 100
