- id: code.functions_over_cyclomatic
  label: functions above the cyclomatic threshold · worst
  group: code
  level: A
  scopes:
  - run
  - repository
  unit: count
  source: lizard over the changed files.
  component_of: null
  additive: false
  missing_words:
  - not run
  - n/a
  - partial
  limits: The count is summed over the repositories and the worst is the larger of their values; no rate
    is computed. A change with no production file in a language lizard parses reads n/a.
  fingerprint_group: true
  methods:
  - n: 1
    description: lizard (`--csv`) measures the functions of the head's changed production files whose
      extension it parses (`languages`); the count is those whose line range contains an added line and
      whose cyclomatic complexity is above 15, and the worst is the largest of them (0 when none is
      above, including when those files hold no function); no such file reads n/a - language not covered.
    parameters:
      threshold: 15
      lizard_command:
      - --csv
      - '{files}'
      languages: &lizard_languages [c, cpp, cc, cxx, h, hh, hpp, java, cs, js, cjs, mjs, py, m, mm, ttcn,
        ttcnpp, rb, php, swift, scala, gd, go, lua, rs, ts, f70, f90, f95, f03, f08, f, for, ftn, fpp, kt,
        kts, sol, erl, hrl, es, escript, zig, tsx, jsx, vue, pl, pm, st, r, R, sql, pks, pkb, pls, plb, pck,
        cbl, cob, cobol, dart, ml, fs, fsx]
      timeout_min: 10
      combine:
        count: sum
        worst: max
