- id: code.deps_not_in_registry
  label: dependencies not found in the registry
  group: code
  level: H
  scopes:
  - run
  - repository
  unit: count
  source: Public package registries, looked up on the analysis date.
  component_of: null
  additive: false
  missing_words:
  - not run
  - not checked
  - raw only
  - partial
  limits: Counts are summed and every rate is recomputed from the summed totals; rates are never summed.
  fingerprint_group: true
  methods:
  - n: 1
    description: Each added dependency is looked up in its registry (the public one, or the declaration's
      for that ecosystem); the count is those the registry does not know. A lookup that cannot be made
      reads not run, and a private registry that does not answer reads not checked.
    parameters:
      registries:
        npm: https://registry.npmjs.org
        pypi: https://pypi.org
      rate_min_lines: 50
      per_lines: 100
- id: code.deps_known_vulns
  label: dependencies with known vulnerabilities
  group: code
  level: H
  scopes:
  - run
  - repository
  unit: count
  source: Public advisory database, looked up on the analysis date.
  component_of: null
  additive: false
  missing_words:
  - not run
  - raw only
  - partial
  limits: Counts are summed and every rate is recomputed from the summed totals; rates are never summed.
  fingerprint_group: true
  methods:
  - n: 1
    description: osv-scanner scans the head's lock files that changed; the count is the added dependencies
      whose name and version it reports as vulnerable. Dependencies read from a manifest alone have no
      lock file and read not run.
    parameters:
      lock_files:
      - package-lock.json
      - pnpm-lock.yaml
      - uv.lock
      - poetry.lock
      osv_command:
      - scan
      - --lockfile
      - '{file}'
      - --format
      - sarif
      - --output-file
      - '{report}'
      osv_json_command:
      - scan
      - --lockfile
      - '{file}'
      - --format
      - json
      - --output-file
      - '{report}'
      timeout_min: 10
      rate_min_lines: 50
      per_lines: 100
