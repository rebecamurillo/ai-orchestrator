- id: time.wall
  label: wall-clock
  group: time
  level: A
  scopes:
  - run
  - epic
  - story
  unit: seconds
  source: Run record start to end
  component_of: null
  additive: false
  missing_words:
  - not recorded
  - n/a — template has no story frame
  limits: Includes the time the Run waited on you.
  fingerprint_group: false
  methods:
  - n: 1
    description: Time from the start to the end of the Run, epic or story as the Run record holds it.
    parameters: {}
- id: time.machine
  label: machine time
  group: time
  level: H
  scopes:
  - run
  - epic
  - story
  unit: seconds
  source: derived
  component_of: null
  additive: false
  missing_words:
  - not recorded
  - n/a — template has no story frame
  limits: Derived from wall-clock and the parked time.
  fingerprint_group: false
  methods:
  - n: 1
    description: Wall-clock minus the time spent waiting on you.
    parameters: {}
- id: time.parked
  label: waiting on you
  group: time
  level: H
  scopes:
  - run
  - park
  unit: seconds
  source: gate record park to resume
  component_of: null
  additive: false
  missing_words:
  - not recorded
  limits: A park still open has no end; it counts up to now.
  fingerprint_group: false
  methods:
  - n: 1
    description: Time from a park to its resume, per park, and its sum for the Run.
    parameters: {}
- id: time.attempt_seconds
  label: attempt time
  group: time
  level: A
  scopes:
  - run
  - role
  - model
  unit: seconds
  source: attempts
  component_of: null
  additive: within_scope_type
  missing_words:
  - not recorded
  limits: 'Not a share of wall-clock: attempts can overlap and are not the whole Run.'
  fingerprint_group: false
  methods:
  - n: 1
    description: The sum of attempt durations in scope.
    parameters: {}
