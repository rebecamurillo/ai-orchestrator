- id: activity.messages_session
  label: messages, session
  group: activity
  level: A
  scopes:
  - run
  - epic
  - story
  - attempt
  unit: count
  source: attempt log
  component_of: null
  additive: within_scope_type
  missing_words:
  - not available
  - not recorded
  - n/a — template has no story frame
  limits: Describes how the method works, not how well. Not available where the harness log lacks the
    column.
  fingerprint_group: true
  methods:
  - n: 1
    description: Messages in the session conversation of the attempts in scope.
    parameters: {}
