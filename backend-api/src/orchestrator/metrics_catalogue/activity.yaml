- id: activity.test_runs
  label: test runs
  group: activity
  level: A
  scopes:
  - run
  - attempt
  unit: count
  source: attempt log
  component_of: null
  additive: within_scope_type
  missing_words:
  - not available
  - not recorded
  limits: Matches the command text only; a wrapper script is not recognised.
  fingerprint_group: false
  methods:
  - n: 1
    description: Shell tool calls whose command starts with a known test command.
    parameters:
      test_run_patterns:
      - pnpm test
      - npm test
      - yarn test
      - pytest
      - vitest
      - jest
      - playwright test
      - make test
      - go test
      - cargo test
