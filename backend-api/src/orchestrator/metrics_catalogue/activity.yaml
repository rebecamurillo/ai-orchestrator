- id: activity.pause_longest
  label: longest pause
  group: activity
  level: A
  scopes:
  - attempt
  - conversation
  - run
  unit: seconds
  source: attempt log
  component_of: null
  additive: false
  missing_words:
  - not available
  - not recorded
  limits: Gaps under the minimum gap are not pauses. Not available where the harness log lacks timestamps.
  fingerprint_group: false
  methods:
  - n: 1
    description: The longest gap between two consecutive messages of a conversation, per conversation;
      for a Run the maximum.
    parameters:
      min_gap_seconds: 60
- id: activity.pauses_over_cache_lifetime
  label: pauses over cache lifetime
  group: activity
  level: A
  scopes:
  - run
  - epic
  - story
  - attempt
  unit: count
  source: attempt log
  component_of: null
  additive: false
  missing_words:
  - not available
  - not recorded
  - n/a — template has no story frame
  limits: Describes how the method works, not how well.
  fingerprint_group: true
  methods:
  - n: 1
    description: Pauses longer than the cache lifetime of their conversation, which let the prompt cache
      expire.
    parameters:
      session_cache_seconds: 3600
      subagent_cache_seconds: 300
