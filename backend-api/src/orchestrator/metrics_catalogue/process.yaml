- id: process.attempts
  label: attempts
  group: process
  level: H
  scopes:
  - run
  - epic
  - story
  - step
  - role
  unit: count
  source: attempts
  component_of: null
  additive: within_scope_type
  missing_words:
  - not recorded
  - n/a — template has no story frame
  limits: A skipped step has no attempt and is not counted.
  fingerprint_group: false
  methods:
  - n: 1
    description: The number of attempt records in scope.
    parameters: {}
- id: process.retries
  label: retries, redispatches, your retries
  group: process
  level: H
  scopes:
  - run
  - epic
  - story
  - step
  unit: count
  source: step `retry_count`, `redispatch_count`, gate record operator `retry`
  component_of: null
  additive: within_scope_type
  missing_words:
  - not recorded
  - n/a — template has no story frame
  limits: Three separate counts; never merged into one figure.
  fingerprint_group: false
  methods:
  - n: 1
    description: 'Three counts per scope: automatic retries from the step''s retry_count, redispatches
      from its redispatch_count, and the retries you ordered at a gate.'
    parameters: {}
