[project]
name = "orchestrator"
version = "0.1.0"
description = "ai-orchestrator backend-api — plans, executes, and parks BMAD dev-loop Runs"
requires-python = "==3.14.*"
dependencies = [
    "alembic==1.19.1",
    # AD-6: the durable engine. Imported only under `infrastructure/dbos/`, which the
    # forbidden contract below makes checkable rather than a review note.
    "dbos==2.31.0",
    # Fernet, for the Project env vars encrypted at rest with ORCHESTRATOR_SECRET_KEY (AD-5)
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    # AD-11: tracing. Imported only under `infrastructure/tracing/`, per the forbidden
    # contract below.
    "langfuse==4.15.1",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    # AD-15: `application/templates/lines.py` loads Template YAML, so PyYAML is a runtime
    # dependency, not only the test helper it started as. It stays in the dev group too:
    # `tests/unit/test_coverage_gates.py` is frozen and asserts it is pinned there.
    "pyyaml==6.0.3",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "structlog==26.1.0",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "import-linter==2.14",
    "schemathesis==4.25.2",
    # the changed-lines half of the AD-18 coverage rule; `make coverage` runs it
    "diff-cover==10.5.1",
    # `tests/unit/test_ci_workflow.py` reads the workflow as a document, not as text
    "pyyaml==6.0.3",
    # PyYAML ships no inline types; `mypy --strict` covers `application/templates/lines.py`
    "types-pyyaml==6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# DTZ/T20/RUF added after review: they make "no naive datetime", "no print" and
# "no dead noqa" checkable instead of prose in AGENTS.md.
select = ["E", "F", "I", "B", "UP", "PL", "C90", "DTZ", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Story 9-2 left these in existing test files that hard rule 1 forbids editing.
# I001: import order in files where a mid-block comment forced a non-standard arrangement.
# PLC0415: deliberate in-function import in test_null_tracer.py to guard langfuse construction.
# E501: first-line docstring in test_startup_tracing_off.py exceeds 100 chars by one.
"tests/unit/test_null_tracer.py" = ["I001", "PLC0415"]
"tests/unit/test_providers_tracing_off.py" = ["I001"]
"tests/unit/test_startup_tracing_off.py" = ["E501"]

[tool.ruff.format]
# Story 9-2 left these test files with formatting that hard rule 1 forbids fixing.
exclude = ["tests/unit/test_null_tracer.py", "tests/unit/test_providers_tracing_off.py"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# backend-api/AGENTS.md: a function is <= 50 lines; PLR0915 counts statements
max-statements = 50

# ── mypy — strict, scoped to the two layers that hold the rules ──────────────
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/orchestrator/domain", "src/orchestrator/application"]

# ── import-linter — AD-2 dependency direction ────────────────────────────────
[tool.importlinter]
root_package = "orchestrator"
# required for the forbidden contracts below to see modules outside the root package
include_external_packages = true

[[tool.importlinter.contracts]]
name = "AD-2 layers: tools -> main -> {api, infrastructure} -> application -> domain"
type = "layers"
layers = [
    # command-line tools build the composition root to inspect it; nothing imports them back
    "orchestrator.tools",
    "orchestrator.main",
    "orchestrator.api : orchestrator.infrastructure",
    "orchestrator.application",
    "orchestrator.domain",
]

[[tool.importlinter.contracts]]
name = "AD-2 forbidden: domain imports no framework, no I/O"
type = "forbidden"
source_modules = ["orchestrator.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "dbos",
    "subprocess",
    "os",
    "shutil",
    "httpx",
    "langfuse",
    "git",
    # AD-5: the rules encrypt through the `Crypto` port and hold no key; only
    # `infrastructure/crypto/` imports the library that has one
    "cryptography",
]

[[tool.importlinter.contracts]]
name = "AD-2 forbidden: application imports no framework, no I/O"
type = "forbidden"
source_modules = ["orchestrator.application"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "dbos",
    "subprocess",
    "os",
    "shutil",
    "httpx",
    "langfuse",
    "git",
    # AD-5: the rules encrypt through the `Crypto` port and hold no key; only
    # `infrastructure/crypto/` imports the library that has one
    "cryptography",
]

[[tool.importlinter.contracts]]
# AD-6: the durable engine is a port, and the library that implements it is named once.
# `allow_indirect_imports` is what makes this the rule it says it is: `main.py` may reach the
# adapter package (it wires it), and this contract is about which module writes `import dbos`.
# The one exception is listed, so adding a second `import dbos` anywhere fails `make lint`.
name = "AD-6 forbidden: only infrastructure/dbos/facade.py imports dbos"
type = "forbidden"
source_modules = ["orchestrator"]
forbidden_modules = ["dbos"]
allow_indirect_imports = true
ignore_imports = ["orchestrator.infrastructure.dbos.facade -> dbos"]

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --strict-markers, because the selection below is a *gate*: without it `-m "not durabilty"`
# is a typo that silently selects everything, and `make e2e-api` would kill the stack it is
# running against instead of deselecting the one module that does.
addopts = "--strict-markers"
# `durability` is the restart-and-orphan proof (SPEC CAP-17): it SIGKILLs the backend-api
# container and brings it back, so it needs a compose stack rather than any running backend.
# `make e2e-api` deselects it (`E2E_MARKER`), `make durability` selects it; declaring it here
# is what lets both express the selection as a marker instead of a path.
# `uj3` is the whole journey (SPEC CAP-8): it is inside the default selection, so `make e2e`
# runs it like any other module, and naming it is what lets `E2E_MARKER=uj3 make e2e-api`
# drive UJ-3 alone against a stack that is already up.
markers = [
    "durability: kills and restarts the backend-api container; needs a compose stack",
    "uj3: the UJ-3 journey end to end on the `fake` harness; needs ORCH_TEST_MODE=1",
]

# ── coverage — AD-18 "the gates are checkable" ───────────────────────────────
# Branch coverage over the whole package, measured in one run: `make test` prints the
# whole-package report, writes `coverage.xml` for `make coverage` (diff-cover, changed
# lines >= 90 %), and then re-reports over `domain/` + `application/` alone with
# `--fail-under=100`. The 100 % lives on that command rather than here because a
# repository-wide `fail_under` would also fire on the informational whole-package report;
# `tests/unit/test_coverage_gates.py` asserts the recipe so it cannot be lowered silently.
[tool.coverage.run]
branch = true
source = ["src/orchestrator"]

[tool.coverage.report]
show_missing = true
# no `exclude_also`: the rule packages reach 100 % because they are tested, not because
# lines were carved out of the measurement
