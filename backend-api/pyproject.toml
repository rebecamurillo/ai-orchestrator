[project]
name = "orchestrator"
version = "0.1.0"
description = "ai-orchestrator backend-api — plans, executes, and parks BMAD dev-loop Runs"
requires-python = "==3.14.*"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "structlog==26.1.0",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "import-linter==2.14",
    "schemathesis==4.25.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# DTZ/T20/RUF added after review: they make "no naive datetime", "no print" and
# "no dead noqa" checkable instead of prose in AGENTS.md.
select = ["E", "F", "I", "B", "UP", "PL", "C90", "DTZ", "T20", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# backend-api/AGENTS.md: a function is <= 50 lines; PLR0915 counts statements
max-statements = 50

# ── mypy — strict, scoped to the two layers that hold the rules ──────────────
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/orchestrator/domain", "src/orchestrator/application"]

# ── import-linter — AD-2 dependency direction ────────────────────────────────
[tool.importlinter]
root_package = "orchestrator"
# required for the forbidden contracts below to see modules outside the root package
include_external_packages = true

[[tool.importlinter.contracts]]
name = "AD-2 layers: tools -> main -> {api, infrastructure} -> application -> domain"
type = "layers"
layers = [
    # command-line tools build the composition root to inspect it; nothing imports them back
    "orchestrator.tools",
    "orchestrator.main",
    "orchestrator.api : orchestrator.infrastructure",
    "orchestrator.application",
    "orchestrator.domain",
]

[[tool.importlinter.contracts]]
name = "AD-2 forbidden: domain imports no framework, no I/O"
type = "forbidden"
source_modules = ["orchestrator.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "dbos",
    "subprocess",
    "os",
    "shutil",
    "httpx",
    "langfuse",
    "git",
]

[[tool.importlinter.contracts]]
name = "AD-2 forbidden: application imports no framework, no I/O"
type = "forbidden"
source_modules = ["orchestrator.application"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "dbos",
    "subprocess",
    "os",
    "shutil",
    "httpx",
    "langfuse",
    "git",
]

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
