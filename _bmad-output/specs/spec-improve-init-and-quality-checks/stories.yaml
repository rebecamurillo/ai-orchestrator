# Improve repo-init and quality checks — fresh build from main; the abandoned
# feat/improve-init-and-quality-checks branch is read-only reference, never cherry-picked.
- id: "1"
  title: Template-change-proof test suite
  description: >-
    Re-derive SPEC CAP-4 through TDD: content-level template coverage moves onto frozen
    exemplar fixtures, and every unit and e2e test that reads the real templates/ dir asserts
    invariants only — editing a shipped template's steps leaves make test and make e2e-api
    green without touching a test file.
  invoke_dev_with: >-
    Read brownfield.md beside SPEC.md before planning. Editing an existing test that pins
    shipped template content is an operator-authorized anchor edit: expect the protected-path
    park and leave it to the Operator to accept; never delete, skip, or relax an assertion —
    replace pinned content with equivalent coverage over exemplar fixtures in the same commit.
    feat/improve-init-and-quality-checks commit 5cce5ab shows one prior shape of this
    restructure; treat it as reference, and re-derive rather than copy.
- id: "2"
  title: Tiered quality gates in the shipped templates
  description: >-
    SPEC CAP-2 plus CAP-3's gate placement: the Story verify step runs
    repository.unit_test_command and its redispatch context adds the investigate-and-fix
    framing to the FR-10 block; the epic template gains setup (install_command), a unit
    baseline, and an e2e step running quality_gate_command after the stories; a row whose
    Repository command is empty reads skipped with the missing field named. Also SPEC
    CAP-5: the story template pushes the run branch right after commit-guard so progress
    is visible remotely, while the PR link stays a single end-of-epic step.
  invoke_dev_with: >-
    Read brownfield.md beside SPEC.md before planning. The FR-10 Verify Failure block already
    carries command, exit code and log tail — extend its copy, do not build a parallel channel.
    Framing copy states facts and mechanisms (NFR-8); the operator's quoted sentence in SPEC
    CAP-2 is normative in meaning, not exact copy. For CAP-5 reuse the existing git.push
    step kind; keep the epic's end push (a cheap final guarantee) and pr.link as the only
    link step. Story 1's invariant-only suites must stay green through every template edit
    here.
- id: "3"
  title: Frameless agent dispatch
  description: >-
    An agent row with no Story behind it — no spec folder, no story id — plans without an
    invented expect contract, executes and routes on what it observed, and its stops offer no
    dead story or epic skip buttons (groundwork for SPEC CAP-1).
  invoke_dev_with: >-
    Read brownfield.md beside SPEC.md before planning. The abandoned branch's
    test_frameless_dispatch_contract.py documents the defect shape it found: agent_row wrote
    an expect contract onto every row, and the tail then asked the Workspace for
    /stories/-*.md and parked internal. Cover both levels — the plan must not invent a
    contract, and the executor must survive the row the plan really writes.
- id: "4"
  title: repo-init context bootstrap with the Q&A loop
  description: >-
    SPEC CAP-1: repo-init dispatches bmad-project-context through an output-file contract —
    questions artifact plus status open-questions or done — with escalate_when parking the Run,
    the Operator's reply travelling the Epic 6 Answer path into the redispatch, looping until
    done, and the context-review checkpoint as the final gate before commit.
  spec_checkpoint: true
  invoke_dev_with: >-
    Read brownfield.md beside SPEC.md before planning. The dispatch prompt must state the
    contract verbatim in intent: run bmad-project-context; if open questions remain, write
    them to the declared artifact, set status open-questions and stop for review; otherwise
    set status done. Reuse the Answer path (FR-18) for the reply channel — no new park kinds;
    AD-8's two status writers hold. The checkpoint fires even with zero question rounds.
- id: "5"
  title: Epic e2e gate fix agent
  description: >-
    SPEC CAP-3: a failing epic e2e gate dispatches one investigate-and-fix agent carrying the
    gate's failure context, re-runs the gate once, and parks needs_you with the last failure
    readable when it is still red.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Read brownfield.md beside SPEC.md before planning. The DSL redispatch rule
    (model.py BAD_REDISPATCH: earlier agent steps only) and the Story-file-bound FR-10 context
    write do not fit a gate-level fixer as they stand — bring the DSL extension or step
    pattern you choose to the spec checkpoint before implementing. validate/plan/rows remain
    the single source of the redispatch rule, and the construct is exercised through exemplar
    fixtures, never by pinning shipped template content.
