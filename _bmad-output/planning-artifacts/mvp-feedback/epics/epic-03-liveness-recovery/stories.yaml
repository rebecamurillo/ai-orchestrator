    epic folders.
- id: "3-3"
  title: Reply-or-restart — the mode field on Answer and Retry
  description: >-
    The Answer and Retry payloads carry mode: restart | session; restart is today's mechanism
    unchanged; the Signal shape is otherwise untouched and the two-writer rule holds (FR-18, FR-20,
    AD-8/AD-13). Acceptance: mode session against an Attempt not reply_available (harness
    capabilities.resume AND a recorded session_id, AD-10) is refused with 422 naming the reason; a
    session-mode delivery is a new Attempt on the same row — n+1, session_id inherited, start_sha =
    HEAD at delivery, env_for of the new Attempt so spend, trace, and the AD-17 range bill to it;
    mark_started/mark_finished, protected-path check, FR-16 routing, Gateway.spend, budget rule run
    exactly as after a dispatch; the prepare commit is skipped; nothing archived, no re-plan (AD-13);
    Harness.resume returns a HarnessResult like run; the Claude adapter implements it; a harness
    without resume never offers the mode.
  invoke_dev_with: >-
    This story's complete requirements are its stories.yaml entry plus SPEC.md in
    _bmad-output/planning-artifacts/mvp-feedback/epics/epic-03-liveness-recovery/. Do not read other
    epic folders.
- id: "3-4"
  title: The choice on the Answer and Retry surfaces
  description: >-
    The Answer box and Retry control offer the mode choice only when reply_available is true;
    otherwise restart is the only path shown (FR-18/FR-20). Acceptance: the box states in words,
    above the button, exactly what each mode will do — restart: which file is archived where and that
    the Story is re-planned; session: the session continues with the Answer and the Story file stays
    in place; the gate record names the mode; the Run leaves needs_you within one poll interval.
  invoke_dev_with: >-
