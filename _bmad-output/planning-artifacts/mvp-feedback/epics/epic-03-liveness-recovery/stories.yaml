# Epic 3 — a story's entry here plus SPEC.md in this folder are its complete requirements.
- id: "3-1"
  title: Stall detector replaces the default hard kill
  description: >-
    ProcessRunner.start takes optional timeout_min and stall_min; wait returns {exited(code) |
    timed_out | stalled} (AD-14); the shared fake is extended, not duplicated. Acceptance: the stall
    signal is exactly no mtime change under cwd (.git included — covers commits) and no growth of the
    attempt log for n minutes -> kill group; the agent executor composes the park — row error,
    timeout kind, reason "stalled {path}: no activity for {n} min" (FR-10); timeout_min on agent
    steps is optional with no default hard kill; stall_min defaults 30, template-tunable (validate.py
    accepts the key), passed only by the agent executor — never for shell (default 30) or git.*
    (default 5), whose wall clocks stay; any existing test pinning the old agent 90-min default is
    revised only under the operator revision of 2026-09-15, named and dated in the revised test
    (anchor exception 4).
  invoke_dev_with: >-
    This story's complete requirements are its stories.yaml entry plus SPEC.md in
    _bmad-output/planning-artifacts/mvp-feedback/epics/epic-03-liveness-recovery/. Do not read other
    epic folders.
- id: "3-2"
  title: Optional budget — tracked, no cap
  description: >-
    run.budget_usd becomes nullable; with null the budget rule is a no-op and nothing parks
    budget-kind; spend tracking per attempt/story/project is untouched and authoritative (FR-17,
    AD-11). Acceptance: cost surfaces show "tracked, no cap" where the budget row would render —
    cost block and card summary; the Claude adapter omits --max-budget-usd when budget_usd is null
    (AD-10); create_run accepts the missing budget and the halt applies only when one is set; the
    New-workflow budget field gains its "(optional)" mark (completes story 2-5's deferred item).
  invoke_dev_with: >-
    This story's complete requirements are its stories.yaml entry plus SPEC.md in
