# Epic 4 — a story's entry here plus SPEC.md in this folder are its complete requirements.
# F7 infrastructure first (4-1..4-3); it carries the skills F6 (4-4) and F8 (4-6, 4-7) dispatch.
- id: "4-1"
  title: ia-agents-skills installed into every harness at image build
  description: >-
    Create the repository-root ia-agents-skills/ (README states the authoring contract); the
    backend-api image copies it beside the BMAD stubs into ~/.claude/skills and ~/.agents/skills;
    scripts/harness/*.sh install extends to cover it (AD-16). Acceptance: the image build fails on a
    name collision between the stub set and ia-agents-skills/ and writes skills-manifest.json — the
    union, per harness home; the gitignore contract extends to the corresponding folders; a change to
    ia-agents-skills/ ships by image rebuild, never per Run.
  invoke_dev_with: >-
    This story's complete requirements are its stories.yaml entry plus SPEC.md in
    _bmad-output/planning-artifacts/mvp-feedback/epics/epic-04-method/. Do not read other epic
    folders.
