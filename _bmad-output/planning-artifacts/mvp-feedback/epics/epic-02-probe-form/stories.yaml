# Epic 2 — a story's entry here plus SPEC.md in this folder are its complete requirements.
- id: "2-1"
  title: The probe — script verb, port, and route
  description: >-
    Each scripts/harness/<name>.sh gains a probe verb reusing doctor's checks — CLI present at the
    pinned version, credentials valid (one trivial call), Gateway reachable — plus model enumeration
    (FR-33). Acceptance: the Harness port gains probe() -> ProbeResult{ok, failing_reason?, version,
    models[]}; the adapter shells the verb so application code reads only the port (AD-10, AD-2); one
    shared fake lands in tests/unit/fakes/; GET /api/v1/harnesses/{name}/probe serves it, failures
    carrying the specific reason ("not logged in", "gateway unreachable") — never a bare flag;
    contract regenerated without drift (AD-3).
  invoke_dev_with: >-
    This story's complete requirements are its stories.yaml entry plus SPEC.md in
    _bmad-output/planning-artifacts/mvp-feedback/epics/epic-02-probe-form/. Do not read other epic
    folders.
- id: "2-2"
  title: Probe gates create_run and pre-flight; model enforced server-side
  description: >-
    Pre-flight's harness line reads the Probe result; the stored enabled flag is read by neither
    pre-flight nor create_run (FR-33, AD-10). Acceptance: create_run re-runs the Probe inline once at
    create and rejects a model outside the probed list with 422 naming the list — on every create,
    not only the form (FR-8); a harness whose version pin changed fails the Probe's version check
    until the CLI matches; queued and parked Runs keep their harness and resume on it; the readiness
    Run is subject to the same Probe as any create and the old enabled-exemption logic is removed.
  invoke_dev_with: >-
    This story's complete requirements are its stories.yaml entry plus SPEC.md in
    _bmad-output/planning-artifacts/mvp-feedback/epics/epic-02-probe-form/. Do not read other epic
    folders.
- id: "2-3"
  title: Probe-gated New-workflow form with enforced model select
  description: >-
    The harness row lists one line per harness with the live probe result in words ("ok", or the
    specific reason); a failing harness cannot be selected and its line states why — never a disabled
    flag (EXPERIENCE-v1 §2.1). Acceptance: probe success loads the model select over the probed
    models — never free text; the probe runs on harness selection and on submit only; other field
    changes re-run pure plan_run (AD-10); a probe failure blocks submission with the reason in the
    pre-flight readout; warnings never block.
  invoke_dev_with: >-
    This story's complete requirements are its stories.yaml entry plus SPEC.md in
    _bmad-output/planning-artifacts/mvp-feedback/epics/epic-02-probe-form/. Do not read other epic
    folders.
- id: "2-4"
  title: Readiness demoted to an informational diagnostic
  description: >-
    The harness row shows the readiness badge — last run time and, on failure, the first failing
    check line — beside a "run readiness" link; it informs, it does not gate (FR-33). Acceptance:
    GET /harnesses carries probe result + badge; use_cases/harness_readiness keeps writing the state;
    sync_pins() resets the badge of a harness whose pin changed (AD-10); readiness Runs stay ordinary
    Runs on the Board (Project "readiness", branch readiness/{harness}/{date}, never pushed).
  invoke_dev_with: >-
    This story's complete requirements are its stories.yaml entry plus SPEC.md in
    _bmad-output/planning-artifacts/mvp-feedback/epics/epic-02-probe-form/. Do not read other epic
    folders.
- id: "2-5"
  title: Form tooltips and mandatory marks
  description: >-
    Every New-workflow input carries a tooltip stating why it matters and what consumes it; mandatory
    inputs are marked * (item 6). Acceptance: optional inputs say so in words — e.g. manual estimate
    "(optional)"; the budget field gains its "(optional)" mark when FR-17's optionality lands (epic 3,
    story 3-2 — until then it renders as today); copy states facts and mechanisms, never congratulates
    (NFR-8).
  done_checkpoint: true
  invoke_dev_with: >-
