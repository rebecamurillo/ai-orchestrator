- id: "1-5"
  title: Diagram dialect — colours, iteration boxes, click navigation
  description: >-
    The embedded diagram maps stored tokens to border colours exactly per the AD-15 map — done green,
    running blue (signal-criterion), error red, blocked|checkpoint amber, planned|queued grey,
    skipped|cancelled faint grey — word token always beside the colour, no node with two colours,
    skipped never green (FR-29, NFR-6 exemption, NFR-2). Acceptance: graph.py computes each group's
    "k/n steps" into the groups payload (k = rows done, n = rows not skipped; all-skipped groups show
    no count) and iteration boxes carry label, chip + token, k/n; group boxes expand one level per
    click, never hover; the path to the current node starts expanded; the "now" marker sits on the
    current node; poll updates change statuses in place — boxes never move or re-collapse under the
    cursor; a leaf node navigates to its Step-run detail (story 1-2); no click-scrolls behaviour
    remains.
  invoke_dev_with: >-
    This story's complete requirements are its stories.yaml entry plus SPEC.md in
    _bmad-output/planning-artifacts/mvp-feedback/epics/epic-01-observability/. Do not read other
    epic folders.
