- id: "1-2"
  title: Step-run detail page
  description: >-
    New page /workflows/:runId/steps/{path} with the Path in dot-index form (epics.0.stories.3.build),
    bookmarkable, existing for a Step in any status. Acceptance: shows kind, Gate strength,
    with_resolved, and the canonical bracket Path; planned shows "no attempts yet", skipped shows the
    reason in words; one web-client util owns the bracket<->dot-index bijection (encode and decode) and
    the API is called with bracket Paths only (AD-15); attempts render newest first with the latest
    selected — status, exit code, duration, cost, full Session id with a copy control; per agent
    attempt the dispatch prompt (and a retry's exact retry.prompt) and the agent's verbatim result
    (the whole "## Auto Run Result" block; "— running" in flight); non-agent attempts show command and
    exit lines; the selected attempt's log renders via story 1-1 — follow on by default while running,
    scroll-up pauses, resume control, download, survives reload mid-follow; Steps-table and
    Runs-history rows link here (FR-25); a blocked or checkpointed Step states the stop and links back
    to the Run detail's stop zone — no signal actions on this page. (FR-34)
