- id: "1-1"
  title: Serve any Attempt's full log
  description: >-
    GET /api/v1/runs/{id}/attempts/{attempt_id}/log serves the raw log with cursor paging for every
    step kind, deterministic and agent alike, through the web-client proxy only (AD-1). Acceptance:
    polling with the last cursor on a running attempt returns only appended content (live follow on
    the FR-24 interval); a garbage-collected log answers "log no longer on disk" — words, never an
    error surface; a download variant serves the raw file; make openapi + pnpm gen:api show no drift
    (AD-3). (FR-34)
