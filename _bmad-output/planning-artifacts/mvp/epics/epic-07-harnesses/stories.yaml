# Epic 7 — built unattended by Sonnet-class agents through bmad-build-auto (folder+id dispatch),
# except the two readiness proofs, which need the host services and pause for the operator.
#
# This epic is run by the orchestrator itself. Stories 7-2 and 7-4 are operator-run: a coding agent
# writes the code and the runbook, halts `blocked` naming what the operator must run, and — resumed
# with the operator's Answer — records what they observed. An agent never runs a real harness, never
# reconfigures the host, and never records an outcome nobody saw. Each of those two briefs opens with
# an "Operator and agent split" section stating exactly where the line falls.
- id: "7-1"
  title: Codex adapter and script
  description: >-
    infrastructure/harness/codex/adapter.py over the Harness port: codex exec with JSON events, session
    id captured from the thread event, danger-full-access, headers by env name, the contract test, and
    the resume command (SPEC CAP-1, FR-14 codex).
  spec_checkpoint: true
  invoke_dev_with: >-
    Read _bmad-output/planning-artifacts/mvp/epics/epic-07-harnesses/briefs/7-1-codex-adapter.md
    before planning. It is this story's complete requirements: scope, binding rules, acceptance criteria,
    and implementation notes. Do not read the other briefs.
- id: "7-2"
  title: Codex readiness passes end to end
  description: >-
    Run the codex readiness Run against the host services, settle TRACEPARENT honouring or apply the
    documented fallback, and record the verified invocation in the addendum (SPEC CAP-2, FR-33, PRD §8
    item 2).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Read _bmad-output/planning-artifacts/mvp/epics/epic-07-harnesses/briefs/7-2-codex-readiness-end-to-end.md
    before planning. It is this story's complete requirements. Do not read the other briefs. This story
    needs the host LiteLLM and Langfuse reachable; halt blocked with the reason if they are not.
    Read its "Operator and agent split" section first: you write the code, the fallbacks and the runbook,
    then halt blocked naming exactly what the operator must run and the facts to report back. You never
    run the real harness yourself, and you record nothing in the addendum that the operator did not
    observe.
- id: "7-3"
  title: OpenCode adapter and script for local models
  description: >-
    infrastructure/harness/opencode/adapter.py: opencode run with JSON output, session id from events
    or the session store, the Langfuse plugin keyed by the Run id, attempt_observed by user id, LOCAL_MODELS,
    cost recorded as zero with tokens (SPEC CAP-3, FR-14 local, FR-27).
  spec_checkpoint: true
  invoke_dev_with: >-
    Read _bmad-output/planning-artifacts/mvp/epics/epic-07-harnesses/briefs/7-3-opencode-adapter.md
    before planning. It is this story's complete requirements. Do not read the other briefs.
- id: "7-4"
  title: OpenCode readiness passes end to end with host model serving
  description: >-
    Configure the host LiteLLM for the local model server, run the local readiness Run, record the
    setup and results, or record the documented fallback (SPEC CAP-4, FR-33, PRD §8 items 7–8).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Read _bmad-output/planning-artifacts/mvp/epics/epic-07-harnesses/briefs/7-4-opencode-readiness-end-to-end.md
    before planning. It is this story's complete requirements. Do not read the other briefs. This story
    needs the host LiteLLM, Langfuse, and the local model server reachable; halt blocked with the reason if
    they are not.
    Read its "Operator and agent split" section first: you write the proposed host config and the runbook,
    then halt blocked naming what the operator must start, restart and run. You never apply host changes
    or run the real harness yourself, and you record nothing in the addendum that the operator did not
    observe. Recording the PRD 6.1 fallback is an acceptable outcome for this story.
